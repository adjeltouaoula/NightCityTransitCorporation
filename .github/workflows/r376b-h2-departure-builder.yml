name: r377a H2 lane-locked handoff builder

on:
  push:
    branches:
      - automation/r377a-h2-lane-locked-handoff-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build r377a
        shell: bash
        run: bash tools/r376b/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r377a-h2-lane-locked-handoff
          path: |
            ${{ runner.temp }}/NightCityTransitCorporation-0.3.0-devkit-r377a-h2-lane-locked-handoff-development.zip
            ${{ runner.temp }}/r377a.sha256
            ${{ runner.temp }}/r377a-metadata.txt
          compression-level: 0
