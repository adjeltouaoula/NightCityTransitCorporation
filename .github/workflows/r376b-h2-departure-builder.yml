name: r377c H2 right-lane deterministic bay builder

on:
  push:
    branches:
      - automation/r377c-h2-right-lane-deterministic-bay-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare r377c deterministic bay and right-lane exit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          # Preserve the proven r376f/r376e curb-clearance concept while fixing
          # the actual road-lane problem seen in r377b. The nose moves road-side
          # through p7, then the path returns toward the curb/right-hand lane and
          # ends before the nearby intersection around world X ~= -2157.8.
          program = Path('tools/r376b/Program.cs')
          s = program.read_text()
          geometry = [
              ('spline.Points.Add(Point( 0.20f, -37.00f, 0.0f, 5));', 'spline.Points.Add(Point( 1.20f, -37.00f, 0.0f, 5));'),
              ('spline.Points.Add(Point( 2.00f, -41.00f, 0.0f, 6));', 'spline.Points.Add(Point( 4.10f, -41.00f, 0.0f, 6));'),
              ('spline.Points.Add(Point( 3.50f, -45.50f, 0.0f, 7));', 'spline.Points.Add(Point( 6.20f, -45.50f, 0.0f, 7));'),
              ('spline.Points.Add(Point( 4.10f, -50.00f, 0.0f, 8));', 'spline.Points.Add(Point( 5.80f, -49.00f, 0.0f, 8));'),
          ]
          for i, (old, new) in enumerate(geometry, 5):
              s = replace_once(s, old, new, f'geometry point {i}')
          s = replace_once(
              s,
              'spline.Points.Add(Point( 4.15f, -62.00f, 0.0f, 9));',
              'spline.Points.Add(Point( 4.40f, -52.00f, 0.0f, 9));\n'
              'spline.Points.Add(Point( 3.20f, -55.00f, 0.0f, 10));',
              'right-lane tail')
          s = replace_once(
              s,
              '// H2 departure only. Local coordinates use the exact same P1 origin as the\n// validated r376a arrival. Hold the bus on the bay axis until P2, merge only\n// after the bay end, then finish with a straight road-aligned tail.',
              '// H2 departure only. Keep validated curb clearance through the bay exit,\n// then return toward the curb/right-hand traffic lane before the intersection.\n// The shorter stop-at-end tail also forces braking earlier than r377b.',
              'geometry comment')
          s = replace_once(s, 'Points.Count != 9', 'Points.Count != 10', 'point-count verify')
          s = replace_once(s, 'R376B_WORLD_OK', 'R377C_WORLD_OK', 'world label')
          program.write_text(s)

          build = Path('tools/r376b/build.sh')
          b = build.read_text()
          replacements = [
              ('CLEAN_BRANCH="experiment/r376b-h2-native-spline-departure"', 'CLEAN_BRANCH="experiment/r377c-h2-right-lane-deterministic-bay"'),
              ("grep -q 'nctc_dev_build_revision.*, 37602'", "grep -q 'nctc_dev_build_revision.*, 37609'"),
              ("grep -q 'r376b H2 native spline arrival + departure'", "grep -q 'r377c H2 right lane deterministic bay'"),
              ('git -C "$CLEAN" commit -m "feat: r376b H2 native spline departure"', 'git -C "$CLEAN" commit -m "fix: r377c H2 deterministic bay and right lane"'),
              ('Devkit: r376b H2 native spline arrival + departure', 'Devkit: r377c H2 right lane deterministic bay'),
              ('Runtime build: 37602', 'Runtime build: 37609'),
              ('Scope: H2 only. The user-validated r376a arrival archive is byte-identical. r376b adds a separate native worldSplineNode departure spline and rolling handoff back to native traffic.', 'Scope: H2 only. The validated r376a arrival archive remains byte-identical. H2 no longer permanently bypasses the bay because of the early occupancy probe. Departure keeps proven curb clearance, returns farther toward the curb/right-hand lane before the intersection, and keeps stop-at-end braking.'),
              ('ZIP="$RUNNER_TEMP/NightCityTransitCorporation-0.3.0-devkit-r376b-h2-native-spline-departure-development.zip"', 'ZIP="$RUNNER_TEMP/NightCityTransitCorporation-0.3.0-devkit-r377c-h2-right-lane-deterministic-bay-development.zip"'),
              ('rm -f "$ZIP" "$RUNNER_TEMP/r376b.sha256"', 'rm -f "$ZIP" "$RUNNER_TEMP/r377c.sha256"'),
              ('sha256sum "$ZIP" | tee "$RUNNER_TEMP/r376b.sha256"', 'sha256sum "$ZIP" | tee "$RUNNER_TEMP/r377c.sha256"'),
              ('cat > "$RUNNER_TEMP/r376b-metadata.txt" <<EOF', 'cat > "$RUNNER_TEMP/r377c-metadata.txt" <<EOF'),
              ('cat "$RUNNER_TEMP/r376b-metadata.txt"', 'cat "$RUNNER_TEMP/r377c-metadata.txt"'),
          ]
          for idx, (old, new) in enumerate(replacements):
              b = replace_once(b, old, new, f'build replacement {idx}')
          build.write_text(b)

          patch = Path('tools/r376b/patch.py')
          p = patch.read_text()
          if p.count('37602') != 3:
              raise SystemExit(f'patch revision count: expected 3, got {p.count("37602")}')
          p = p.replace('37602', '37609')
          p = p.replace('r376b H2 native spline arrival + departure', 'r377c H2 right lane deterministic bay')
          p = replace_once(
              p,
              'this.driveCommandSent = this.controller.DriveOnBaySpline("$/nctc/bays/h2/departure_spline", exitSpeed, false);',
              'this.driveCommandSent = this.controller.DriveOnBaySpline("$/nctc/bays/h2/departure_spline", 1.25, true);',
              'slow spline arm')
          p = replace_once(
              p,
              'this.driveCommandSent = this.controller.DriveToTrafficAfterSpline(this.GetTrafficTarget(), 0.00, rollingSpeed);',
              'this.driveCommandSent = this.controller.DriveToTrafficAfterSpline(this.GetTrafficTarget(), 0.00, MaxF(rollingSpeed, 2.50));',
              'low-speed traffic handoff')
          marker = 'transit_path.write_text(s)\n\ncet_path = Path("source/cet/nctc_survey/init.lua")'
          injected = (
              "s = replace_once(\n"
              "    s,\n"
              "    'let bayOccupied: Bool = this.IsBayOccupiedByVehicle();',\n"
              "    'let bayOccupied: Bool = !Equals(this.requestedStopId, 70) && this.IsBayOccupiedByVehicle();',\n"
              "    \"H2 deterministic bay occupancy\",\n"
              ")\n"
              "transit_path.write_text(s)\n\n"
              "cet_path = Path(\"source/cet/nctc_survey/init.lua\")"
          )
          p = replace_once(p, marker, injected, 'H2 deterministic bay patch')
          p = p.replace('r376b H2 native departure spline armed', 'r377c H2 right-lane departure spline armed')
          p = p.replace('r376b H2 native departure spline active telemetry', 'r377c H2 right-lane departure spline active telemetry')
          p = p.replace('r376b H2 spline exit -> native traffic handoff', 'r377c H2 right-lane spline -> native traffic handoff')
          p = p.replace('r376b H2 native departure spline FAILED', 'r377c H2 right-lane departure spline FAILED')
          patch.write_text(p)
          PY

      - name: Build r377c
        shell: bash
        run: bash tools/r376b/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r377c-h2-right-lane-deterministic-bay
          path: |
            ${{ runner.temp }}/NightCityTransitCorporation-0.3.0-devkit-r377c-h2-right-lane-deterministic-bay-development.zip
            ${{ runner.temp }}/r377c.sha256
            ${{ runner.temp }}/r377c-metadata.txt
          compression-level: 0
