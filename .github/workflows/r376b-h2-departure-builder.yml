name: r376b H2 departure builder

on:
  push:
    branches:
      - automation/r376b-h2-departure-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build r376b
        shell: bash
        run: bash tools/r376b/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r376b-h2-native-spline-departure
          path: |
            ${{ runner.temp }}/NightCityTransitCorporation-0.3.0-devkit-r376b-h2-native-spline-departure-development.zip
            ${{ runner.temp }}/r376b.sha256
            ${{ runner.temp }}/r376b-metadata.txt
          compression-level: 0
