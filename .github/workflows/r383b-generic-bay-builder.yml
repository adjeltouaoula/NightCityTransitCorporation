name: r383f generic bay streaming fix builder

on:
  push:
    branches:
      - experiment/r383f-generic-bay-streaming-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Integrate r383f runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/bays/r383f_runtime.patch
          git apply tools/bays/r383f_runtime.patch
          rm -f source/redscript/NCTC/NCTCGenericBayDeparture.reds
          test ! -e source/redscript/NCTC/NCTCGenericBayDeparture.reds
          grep -q 'nctc_dev_build_revision", 38306' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'headingDot >= 0.94' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'bayParkingStage = 15' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'DriveToTrafficAfterJoin' source/redscript/NCTC/NCTCTransitSystem.reds

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install WolvenKit CLI 9.0.1
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r383f"
          mkdir -p "$WORK/tools"
          dotnet tool install WolvenKit.CLI --version 9.0.1 --tool-path "$WORK/tools"

      - name: Generate correctly streamed bay arrival assets
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r383f"
          TOOL="$WORK/tools/cp77tools"
          RAW="$WORK/unpacked"
          TEMPLATE="$WORK/template-json"
          GENERATED="$WORK/generated"
          OUT="$WORK/out"
          mkdir -p "$RAW" "$TEMPLATE" "$GENERATED" "$OUT"

          # Immutable validated H2 source asset.
          test "$(git hash-object source/archive/pc/mod/NCTCH2Spline.archive)" = "ff0be26fb781cf5f2aaf9dd75ce5b668f777a0f6"
          test "$(git hash-object source/archive/pc/mod/NCTCH2Spline.archive.xl)" = "6e934a5637bfe3300832eea2fef179386576c5e1"

          "$TOOL" unbundle source/archive/pc/mod/NCTCH2Spline.archive -o "$RAW"
          SECTOR="$(find "$RAW" -type f -name 'h2_arrival.streamingsector' | head -n1)"
          BLOCK="$(find "$RAW" -type f -name 'all.streamingblock' | head -n1)"
          test -n "$SECTOR"
          test -n "$BLOCK"

          "$TOOL" convert serialize "$SECTOR" -o "$TEMPLATE"
          "$TOOL" convert serialize "$BLOCK" -o "$TEMPLATE"
          SECTOR_JSON="$(find "$TEMPLATE" -type f -name 'h2_arrival.streamingsector.json' | head -n1)"
          BLOCK_JSON="$(find "$TEMPLATE" -type f -name 'all.streamingblock.json' | head -n1)"
          test -n "$SECTOR_JSON"
          test -n "$BLOCK_JSON"

          python3 tools/bays/generate_arrival_splines.py \
            --sector-template "$SECTOR_JSON" \
            --block-template "$BLOCK_JSON" \
            --manifest tools/bays/r383b_test_bays.json \
            --out "$GENERATED"

          # Geometry invariant: stop 70 must still reproduce validated H2.
          ORIGINAL="$SECTOR_JSON" GENERATED_H2="$GENERATED/stop_70/h2_arrival.streamingsector.json" python3 - <<'PY'
          import json, math, os
          def find_spline(x):
              if isinstance(x, dict):
                  if x.get('$type') == 'Spline' and isinstance(x.get('points'), list): return x
                  for v in x.values():
                      f=find_spline(v)
                      if f is not None: return f
              elif isinstance(x, list):
                  for v in x:
                      f=find_spline(v)
                      if f is not None: return f
          a=find_spline(json.load(open(os.environ['ORIGINAL'], encoding='utf-8')))['points']
          b=find_spline(json.load(open(os.environ['GENERATED_H2'], encoding='utf-8')))['points']
          worst=0.0
          for pa,pb in zip(a,b):
              aa=pa['position']; bb=pb['position']
              d=math.hypot(float(aa['X'])-float(bb['X']), float(aa['Y'])-float(bb['Y']))
              worst=max(worst,d)
          print(f'H2 generic reproduction max XY delta = {worst:.6f} m')
          if worst > 0.001:
              raise SystemExit('generic spline recipe no longer reproduces validated H2')
          PY

          # r383f invariant: every generated streaming block must be centered
          # on its own P1 and use the grid cell calculated for that location.
          GENERATED="$GENERATED" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['GENERATED'])
          expected={
            20:(-905.679,-78.399,7.061),
            69:(-2392.823,-520.017,12.674),
            70:(-2161.015,-1012.713,7.851),
          }
          cells={}
          for sid,(x,y,z) in expected.items():
              report=json.load(open(root/f'stop_{sid}'/'report.json',encoding='utf-8'))
              c=report['streamingBoxCenter']
              if max(abs(c['x']-x),abs(c['y']-y),abs(c['z']-z)) > 0.001:
                  raise SystemExit(f'stop {sid}: streaming box not relocated to bay')
              cells[sid]=report['streamingGridCell']
              print(f"stop {sid}: cell={cells[sid]} boxCenter=({c['x']:.3f},{c['y']:.3f},{c['z']:.3f})")
          if len(set(cells.values())) < 2:
              raise SystemExit(f'generated blocks unexpectedly all retained the same streaming cell: {cells}')
          PY

          for STOP in 20 69 70; do
            D="$GENERATED/stop_${STOP}"
            "$TOOL" convert deserialize "$D/h2_arrival.streamingsector.json"
            "$TOOL" convert deserialize "$D/all.streamingblock.json"
            test -s "$D/h2_arrival.streamingsector"
            test -s "$D/all.streamingblock"

            PACKROOT="$WORK/NCTCBay${STOP}Spline"
            mkdir -p "$PACKROOT/nctc/bays/stop_${STOP}/sectors"
            cp "$D/h2_arrival.streamingsector" "$PACKROOT/nctc/bays/stop_${STOP}/sectors/h2_arrival.streamingsector"
            cp "$D/all.streamingblock" "$PACKROOT/nctc/bays/stop_${STOP}/all.streamingblock"
            "$TOOL" pack "$PACKROOT" -o "$OUT"
            test -s "$OUT/NCTCBay${STOP}Spline.archive"
            cat > "$OUT/NCTCBay${STOP}Spline.archive.xl" <<EOF
          streaming:
            blocks:
              - nctc\\bays\\stop_${STOP}\\all.streamingblock
          EOF
          done

          cp "$GENERATED/stop_20/report.json" "$OUT/stop_20_report.json"
          cp "$GENERATED/stop_69/report.json" "$OUT/stop_69_report.json"
          cp "$GENERATED/stop_70/report.json" "$OUT/stop_70_report.json"
          sha256sum "$OUT"/*.archive "$OUT"/*.archive.xl | tee "$OUT/SHA256SUMS.txt"

      - name: Assemble r383f devkit package
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r383f"
          OUT="$WORK/out"
          PKG="$WORK/package"
          mkdir -p \
            "$PKG/archive/pc/mod" \
            "$PKG/r6/scripts/NCTC" \
            "$PKG/r6/tweaks/NCTC" \
            "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger" \
            "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey"

          cp source/archive/pc/mod/* "$PKG/archive/pc/mod/"
          cp "$OUT"/*.archive "$PKG/archive/pc/mod/"
          cp "$OUT"/*.archive.xl "$PKG/archive/pc/mod/"
          cp source/redscript/NCTC/*.reds "$PKG/r6/scripts/NCTC/"
          cp source/tweaks/NCTC/* "$PKG/r6/tweaks/NCTC/"
          cp source/cet/nctc_passenger/* "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger/"
          cp source/cet/nctc_survey/* "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"

          # Never package the player's active persistent network.
          test ! -e "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/nctc_network.json"
          # The old extension file must not return; all generic logic is in the
          # class definitions of NCTCTransitSystem.reds.
          test ! -e "$PKG/r6/scripts/NCTC/NCTCGenericBayDeparture.reds"
          test ! -e "$PKG/r6/scripts/NCTC/NCTCZZGenericBayDeparture.reds"

          cp "$OUT/SHA256SUMS.txt" "$WORK/GENERIC_BAY_ASSET_SHA256SUMS.txt"
          (cd "$PKG" && zip -qr "$WORK/NightCityTransitCorporation-0.3.0-devkit-r383f-generic-bay-streaming-fix.zip" .)
          unzip -t "$WORK/NightCityTransitCorporation-0.3.0-devkit-r383f-generic-bay-streaming-fix.zip"
          sha256sum "$WORK/NightCityTransitCorporation-0.3.0-devkit-r383f-generic-bay-streaming-fix.zip" | tee "$WORK/PACKAGE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r383f-generic-bay-streaming-fix-package
          path: |
            ${{ runner.temp }}/r383f/NightCityTransitCorporation-0.3.0-devkit-r383f-generic-bay-streaming-fix.zip
            ${{ runner.temp }}/r383f/PACKAGE_SHA256.txt
            ${{ runner.temp }}/r383f/GENERIC_BAY_ASSET_SHA256SUMS.txt
            ${{ runner.temp }}/r383f/out/stop_20_report.json
            ${{ runner.temp }}/r383f/out/stop_69_report.json
            ${{ runner.temp }}/r383f/out/stop_70_report.json
          compression-level: 0
