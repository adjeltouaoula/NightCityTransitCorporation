name: materialize next-stop request v1

on:
  push:
    branches:
      - feature/next-stop-request-v1
    paths:
      - .github/workflows/materialize-next-stop-request-v1.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement passenger next-stop request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          reds = Path('source/redscript/NCTC/NCTCTransitSystem.reds')
          s = reds.read_text(encoding='utf-8')

          old = '''  private let serviceStopId: Int32;\n  private let requestedStop: Vector4;'''
          new = '''  private let serviceStopId: Int32;\n  // True only for an in-cabin passenger request. The initial boarding stop is\n  // still a service stop, but is not a passenger \"next stop\" request.\n  private let passengerStopRequested: Bool;\n  private let requestedStop: Vector4;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    if AbsF(this.surveyBerthForward.X) > 0.01 || AbsF(this.surveyBerthForward.Y) > 0.01 {\n      return target + this.surveyBerthForward * 13.70;\n    };'''
          new = '''    if AbsF(this.surveyBerthForward.X) > 0.01 || AbsF(this.surveyBerthForward.Y) > 0.01 {\n      // An unrequested roadside stop is a route marker, not a destination.\n      // Keep a long corridor beyond it so the native traffic controller never\n      // brakes merely because the stop exists. A rolling handoff below changes\n      // to the following route leg while the Mahir is still moving.\n      if !this.HasServiceBay() && !Equals(this.requestedStopId, this.serviceStopId) {\n        return target + this.surveyBerthForward * 100.00;\n      };\n      return target + this.surveyBerthForward * 13.70;\n    };'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    // Reserved for the passenger-request visual state. The display remains\n    // focused on route information: line number and next stop only.\n    quests.SetFact(n"nctc_display_stop_requested", 0);'''
          new = '''    quests.SetFact(\n      n"nctc_display_stop_requested",\n      this.passengerStopRequested && Equals(nextStopId, this.serviceStopId) ? 1 : 0\n    );'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    this.requestedLine = line;\n    this.requestedStopId = stopId;\n    this.serviceStopId = stopId;\n    this.requestedStop = stop;'''
          new = '''    this.requestedLine = line;\n    this.requestedStopId = stopId;\n    // The call stop behaves exactly as before: the summoned bus services it so\n    // V can board. Passenger stop requests only begin after that first service.\n    this.serviceStopId = stopId;\n    this.passengerStopRequested = false;\n    this.requestedStop = stop;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    this.departureRequested = false;\n    this.bayParkingActive = false;'''
          new = '''    this.departureRequested = false;\n    this.passengerStopRequested = false;\n    this.serviceStopId = 0;\n    this.bayParkingActive = false;'''
          # This exact block exists in DespawnServiceBus; RequestService has a
          # similar block but already initialized the service stop above.
          idx = s.find('  public func DespawnServiceBus() -> Bool')
          assert idx >= 0
          tail = s[idx:]
          assert old in tail
          tail = tail.replace(old, new, 1)
          s = s[:idx] + tail

          old = '''  public func SetPlayerAboard(value: Bool) -> Void {\n    if IsDefined(this.controller) {\n      this.controller.SetPlayerAboardSignal(value);\n    };\n  }\n\n  private func ClearRouteWaypoint() -> Void {'''
          new = '''  public func SetPlayerAboard(value: Bool) -> Void {\n    if IsDefined(this.controller) {\n      this.controller.SetPlayerAboardSignal(value);\n    };\n  }\n\n  // Called by the CET cabin input. It always means \"the stop currently shown\n  // as next\". One press reserves exactly one stop; the request is consumed\n  // when that stop completes its normal service dwell.\n  public func RequestNextStop() -> Bool {\n    let quests: ref<QuestsSystem>;\n    if this.requestPending || this.arrived || this.bayParkingActive { return false; };\n    if this.requestedStopId < 1 || this.serviceStopId > 0 || this.passengerStopRequested { return false; };\n    if !IsDefined(this.controller) || !this.controller.IsReady() || !this.controller.IsPlayerAboard() { return false; };\n\n    this.serviceStopId = this.requestedStopId;\n    this.passengerStopRequested = true;\n    quests = GameInstance.GetQuestsSystem(this.GetGameInstance());\n    if IsDefined(quests) {\n      quests.SetFact(n"nctc_display_stop_requested", 1);\n      quests.SetFact(n"nctc_passenger_requested_stop_id", this.requestedStopId);\n      quests.SetFact(n"nctc_display_revision", quests.GetFact(n"nctc_display_revision") + 1);\n      quests.SetFact(n"nctc_dev_build_revision", 38601);\n    };\n\n    // The unrequested roadside command may currently point 100 m beyond this\n    // stop. Replace it immediately so the current next stop becomes the real\n    // service target. Passage routing remains authoritative if one is active.\n    this.controller.CancelTrafficRoute();\n    this.driveCommandSent = false;\n    this.legPolls = 0;\n    this.PublishLoopDiagnostic(93, this.requestedStopId);\n    this.ScheduleDispatch(0.05);\n    return true;\n  }\n\n  private func ClearRouteWaypoint() -> Void {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      this.controller.ClosePassengerDoor();\n      this.serviceStopId = 0;\n      this.arrived = false;'''
          new = '''      this.controller.ClosePassengerDoor();\n      this.serviceStopId = 0;\n      this.passengerStopRequested = false;\n      quests.SetFact(n"nctc_display_stop_requested", 0);\n      quests.SetFact(n"nctc_passenger_requested_stop_id", 0);\n      quests.SetFact(n"nctc_display_revision", quests.GetFact(n"nctc_display_revision") + 1);\n      this.arrived = false;'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''    // Road-stop / occupied-bay fallback remains native traffic.\n'''
          assert marker in s
          block = '''    // Unrequested roadside stop: cross it at traffic speed and hand off to\n    // the following leg without entering ArriveAtStop(), opening doors or\n    // creating a dwell. The long +100 m target above prevents pre-stop braking.\n    if !this.followingPassage && !this.HasServiceBay() && !Equals(this.requestedStopId, this.serviceStopId) {\n      let skipRoadLateral: Float;\n      let skipRoadLongitudinal: Float = this.GetBerthProgress(skipRoadLateral);\n      if skipRoadLongitudinal <= 12.00 && skipRoadLongitudinal >= -8.00 && skipRoadLateral <= 12.00 {\n        let rollingSpeed: Float = AbsF(this.controller.GetCurrentSpeed());\n        if !this.AdvanceToNextStop() {\n          this.PublishLoopDiagnostic(34, 0);\n          this.ScheduleDispatch(1.00);\n          return;\n        };\n        this.legPolls = 0;\n        this.driveCommandSent = this.controller.DriveToTrafficAfterRollingPassage(this.GetTrafficTarget(), 0.00, rollingSpeed);\n        this.PublishLoopDiagnostic(this.driveCommandSent ? 94 : 33, this.requestedStopId);\n        this.ScheduleDispatch(0.05);\n        return;\n      };\n    };\n\n'''
          s = s.replace(marker, block + marker, 1)

          # Source-level invariants for the intended feature.
          assert 'public func RequestNextStop() -> Bool' in s
          assert 'this.passengerStopRequested = true;' in s
          assert 'target + this.surveyBerthForward * 100.00' in s
          assert 'skipRoadLongitudinal <= 12.00' in s
          assert 'nctc_passenger_requested_stop_id' in s
          reds.write_text(s, encoding='utf-8', newline='\n')

          lua = Path('source/cet/nctc_passenger/init.lua')
          l = lua.read_text(encoding='utf-8')
          marker = '''NCBN.tag = "NCTC.ServiceBus"\n'''
          assert marker in l
          helper = '''NCBN.tag = "NCTC.ServiceBus"\n\n-- Passenger stop request. CET owns only the bindable input; Redscript owns\n-- which stop is next and whether that request can still be accepted.\nlocal function requestNextStop()\n    if getFact("nctc_player_in_service_bus") ~= 1 then return false end\n    local container = Game.GetScriptableSystemsContainer()\n    if not container then return false end\n    local ok, system = pcall(function() return container:Get("NCTC.NCTCTransitSystem") end)\n    if not ok or not system then\n        ok, system = pcall(function() return container:Get(CName.new("NCTC.NCTCTransitSystem")) end)\n    end\n    if not ok or not system then return false end\n    local requestOk, accepted = pcall(function() return system:RequestNextStop() end)\n    if requestOk and accepted then\n        print("[NCTC] Passenger requested next stop id=" .. tostring(getFact("nctc_passenger_requested_stop_id")))\n    end\n    return requestOk and accepted\nend\n\nregisterInput("nctc_request_next_stop", "NCTC — Request next stop", function(keypress)\n    if not keypress then return end\n    requestNextStop()\nend)\n'''
          l = l.replace(marker, helper, 1)
          assert 'registerInput("nctc_request_next_stop"' in l
          assert 'system:RequestNextStop()' in l
          lua.write_text(l, encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -q 'public func RequestNextStop()' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'registerInput("nctc_request_next_stop"' source/cet/nctc_passenger/init.lua
      - name: Commit feature source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_passenger/init.lua
          git commit -m "feat: request next stop from service bus"
          git push origin HEAD:feature/next-stop-request-v1
