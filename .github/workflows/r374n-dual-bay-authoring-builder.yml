name: r374n-dual-bay-authoring-builder
on:
  push:
    branches: ["automation/r374n-dual-bay-authoring-builder"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dual bay authoring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('source/cet/nctc_survey/init.lua')
          s = p.read_text()
          s = s.replace('      if vector_has_position(capture.berth) then saved.berth = capture.berth end\n','      if vector_has_position(capture.berth) then saved.berth = capture.berth end\n      if vector_has_position(capture.berth2) then saved.berth2 = capture.berth2 end\n')
          s = s.replace('''local function update_capture_point(capture, point, value)\n  if point == 1 then\n    capture.spawn = value\n    return "spawn"\n  elseif point == 2 then\n    capture.approach = value\n    return "approach"\n  end\n  capture.berth = value\n  return "berth"\nend\n''','''local function update_capture_point(capture, point, value)\n  if point == 1 then\n    capture.spawn = value\n    return "spawn"\n  elseif point == 2 then\n    capture.approach = value\n    return "approach"\n  elseif point == 4 then\n    capture.berth2 = value\n    return "bay point 2"\n  end\n  capture.berth = value\n  return "bay point 1"\nend\n''')
          marker = '''  elseif event_kind == 8 then\n    local position = {\n      x = fact(quests, "nctc_delete_passage_x") / 1000.0,\n      y = fact(quests, "nctc_delete_passage_y") / 1000.0,\n      z = fact(quests, "nctc_delete_passage_z") / 1000.0\n    }\n    local deleted = delete_nearest_passage(network, fact(quests, "nctc_delete_passage_line"), position)\n    kind = deleted and "deleted passage point" or "no passage point deleted"\n'''
          repl = marker + '''  elseif event_kind == 10 then\n    local capture_line = fact(quests, "nctc_survey_capture_line")\n    local capture_stop_index = fact(quests, "nctc_survey_capture_stop_index")\n    local target, count = selected_stop(network, capture_line, capture_stop_index)\n    if not target then\n      log("bay point 2 removal rejected: line " .. tostring(capture_line) .. " stop " .. tostring(capture_stop_index) .. " unavailable")\n      return\n    end\n    local capture = find_capture(network, target.id)\n    if capture and vector_has_position(capture.berth2) then\n      capture.berth2 = nil\n      capture.eventId = event_id\n      kind = "removed bay point 2 L" .. tostring(capture_line) .. " stop " .. tostring(capture_stop_index) .. "/" .. tostring(count)\n    else\n      kind = "no bay point 2 to remove L" .. tostring(capture_line) .. " stop " .. tostring(capture_stop_index) .. "/" .. tostring(count)\n    end\n'''
          if marker not in s: raise SystemExit('event kind 8 marker not found')
          s = s.replace(marker, repl, 1)
          old = '''  local point = { x = round3(position.x), y = round3(position.y), z = round3(position.z), yaw = round3(player:GetWorldYaw()) }\n  update_capture_point(capture, kind == "spawn" and 1 or (kind == "approach" and 2 or 3), point)\n  network.revision = (network.revision or 0) + 1\n  if write_network(network) then\n    local point_code = kind == "spawn" and 1 or (kind == "approach" and 2 or 3)\n    set_fact(quests, "nctc_survey_direct_notice_point", point_code)\n    set_fact(quests, "nctc_survey_direct_notice_id", fact(quests, "nctc_survey_direct_notice_id") + 1)\n    log("direct saved " .. kind .. " L" .. tostring(line) .. " stop " .. tostring(stop_index) .. "/" .. tostring(count)\n      .. " at (" .. tostring(point.x) .. ", " .. tostring(point.y) .. ", " .. tostring(point.z) .. ")")\n  end\n'''
          new = '''  local point = { x = round3(position.x), y = round3(position.y), z = round3(position.z), yaw = round3(player:GetWorldYaw()) }\n  local point_code = kind == "spawn" and 1 or (kind == "approach" and 2 or ((fact(quests, "nctc_survey_edit_bay_point2") == 1) and 4 or 3))\n  local point_name = update_capture_point(capture, point_code, point)\n  network.revision = (network.revision or 0) + 1\n  if write_network(network) then\n    set_fact(quests, "nctc_survey_direct_notice_point", point_code)\n    set_fact(quests, "nctc_survey_direct_notice_id", fact(quests, "nctc_survey_direct_notice_id") + 1)\n    log("direct saved " .. point_name .. " L" .. tostring(line) .. " stop " .. tostring(stop_index) .. "/" .. tostring(count)\n      .. " at (" .. tostring(point.x) .. ", " .. tostring(point.y) .. ", " .. tostring(point.z) .. ")")\n  end\n'''
          if old not in s: raise SystemExit('direct capture block not found')
          s = s.replace(old, new, 1)
          s = s.replace('  apply_vector("nctc_survey_berth_", capture.berth)\n','  apply_vector("nctc_survey_berth_", capture.berth)\n  apply_vector("nctc_survey_berth2_", capture.berth2)\n', 1)
          s = s.replace('''    if kind == "berth" then\n      -- The capture yaw is the surveyed direction of circulation. Publish a\n''','''    if kind == "berth" or kind == "berth2" then\n      -- Bay endpoint yaw is the surveyed direction of circulation. Publish a\n''', 1)
          s = s.replace('  publish_vector("berth", capture.berth)\n','  publish_vector("berth", capture.berth)\n  publish_vector("berth2", capture.berth2)\n', 1)
          s = s.replace('  if revision == 37413 then\n    log("NCTC runtime build=37413 r374m single bay arc + native lane recovery + occupied-bay road stop")\n','  if revision == 37414 then\n    log("NCTC runtime build=37414 r374n dual-point bay authoring")\n  elseif revision == 37413 then\n    log("NCTC runtime build=37413 r374m single bay arc + native lane recovery + occupied-bay road stop")\n', 1)
          p.write_text(s)

          p = Path('source/redscript/NCTC/NCTCSettings.reds')
          s = p.read_text()
          s = s.replace('''        point = quests.GetFact(n"nctc_survey_direct_notice_point");\n        NCTCSettings.Notify(this.game, "NCTC survey confirmed: " + (Equals(point, 1) ? "spawn" : Equals(point, 2) ? "approach" : "berth"));\n''','''        point = quests.GetFact(n"nctc_survey_direct_notice_point");\n        NCTCSettings.Notify(this.game, "NCTC survey confirmed: " + (Equals(point, 1) ? "spawn" : Equals(point, 2) ? "approach" : Equals(point, 4) ? "Bay Point 2" : "Bay Point 1"));\n''', 1)
          insert_after = '  public let recordBerthKey: EInputKey = EInputKey.IK_NumPad3;\n'
          addition = '''\n  @runtimeProperty("ModSettings.mod", "Night City Transit Corporation")\n  @runtimeProperty("ModSettings.displayName", "Edit Bay Point 2")\n  @runtimeProperty("ModSettings.description", "OFF: NumPad 3 creates/updates Bay Point 1 (the existing berth). ON: NumPad 3 creates/updates Bay Point 2, the second end of a bus bay.")\n  @runtimeProperty("ModSettings.category", "Developer mode")\n  @runtimeProperty("ModSettings.dependency", "developerMode")\n  public let editBayPoint2: Bool = false;\n\n  @runtimeProperty("ModSettings.mod", "Night City Transit Corporation")\n  @runtimeProperty("ModSettings.displayName", "Remove Bay Point 2")\n  @runtimeProperty("ModSettings.description", "One-shot action. Removes only Bay Point 2 from the selected stop, keeps Bay Point 1, then resets to OFF.")\n  @runtimeProperty("ModSettings.category", "Developer mode")\n  @runtimeProperty("ModSettings.dependency", "developerMode")\n  public let removeBayPoint2: Bool = false;\n'''
          if insert_after not in s: raise SystemExit('recordBerthKey marker not found')
          s = s.replace(insert_after, insert_after + addition, 1)
          s = s.replace('''  private func OnAttach() -> Void {\n    let callback: ref<NCTCDirectSurveyNoticeCallback>;\n''','''  private let lastBayPoint2EditMode: Bool;\n\n  private func OnAttach() -> Void {\n    let callback: ref<NCTCDirectSurveyNoticeCallback>;\n''', 1)
          s = s.replace('''    this.RegisterSettings();\n    this.PublishSurveySettings();\n''','''    this.RegisterSettings();\n    this.lastBayPoint2EditMode = this.editBayPoint2;\n    this.PublishSurveySettings();\n''', 1)
          old = '''  public func OnModSettingsChange() -> Void {\n    this.PublishSurveySettings();\n    this.UpdateDeveloperVisibility();\n    if this.developerMode { this.NotifySelectedSurveyStop(); };\n  }\n'''
          new = '''  public func OnModSettingsChange() -> Void {\n    if this.developerMode && NotEquals(this.editBayPoint2, this.lastBayPoint2EditMode) {\n      this.lastBayPoint2EditMode = this.editBayPoint2;\n      NCTCSettings.Notify(this.GetGameInstance(), this.editBayPoint2 ? "NCTC - Editing Bay Point 2" : "NCTC - Editing Bay Point 1");\n    };\n    if this.developerMode && this.removeBayPoint2 {\n      this.removeBayPoint2 = false;\n      this.RemoveSelectedBayPoint2();\n    };\n    this.PublishSurveySettings();\n    this.UpdateDeveloperVisibility();\n    if this.developerMode { this.NotifySelectedSurveyStop(); };\n  }\n'''
          if old not in s: raise SystemExit('OnModSettingsChange marker not found')
          s = s.replace(old, new, 1)
          s = s.replace('''    quests.SetFact(n"nctc_survey_selected_stop_index", this.surveyStopIndex);\n    quests.SetFact(n"nctc_survey_passage", EnumInt(this.surveyPassage));\n''','''    quests.SetFact(n"nctc_survey_selected_stop_index", this.surveyStopIndex);\n    quests.SetFact(n"nctc_survey_edit_bay_point2", this.editBayPoint2 ? 1 : 0);\n    quests.SetFact(n"nctc_survey_passage", EnumInt(this.surveyPassage));\n''', 1)
          s = s.replace('''    NCTCSettings.Notify(this.GetGameInstance(), "NCTC survey: line " + ToString(line) + " · stop " + ToString(this.surveyStopIndex) + " · " + markers.GetSurveyStopName(line, this.surveyStopIndex));\n''','''    NCTCSettings.Notify(this.GetGameInstance(), "NCTC survey: line " + ToString(line) + " · stop " + ToString(this.surveyStopIndex) + " · " + markers.GetSurveyStopName(line, this.surveyStopIndex) + " · editing " + (this.editBayPoint2 ? "Bay Point 2" : "Bay Point 1"));\n''', 1)
          needle = '''      if Equals(variable.GetName(), n"surveyLine") || Equals(variable.GetName(), n"surveyPassage") || Equals(variable.GetName(), n"recordSpawnKey") || Equals(variable.GetName(), n"recordApproachKey") || Equals(variable.GetName(), n"recordBerthKey") || Equals(variable.GetName(), n"draftLineNumber") || Equals(variable.GetName(), n"beginDraftLine") { variable.SetVisible(false); }\n      else if !Equals(variable.GetName(), n"developerMode") { variable.SetVisible(this.developerMode); };\n'''
          replacement = '''      if Equals(variable.GetName(), n"surveyLine") || Equals(variable.GetName(), n"surveyPassage") || Equals(variable.GetName(), n"recordSpawnKey") || Equals(variable.GetName(), n"recordApproachKey") || Equals(variable.GetName(), n"recordBerthKey") || Equals(variable.GetName(), n"draftLineNumber") || Equals(variable.GetName(), n"beginDraftLine") { variable.SetVisible(false); }\n      else if Equals(variable.GetName(), n"removeBayPoint2") { variable.SetVisible(this.developerMode && this.editBayPoint2); }\n      else if !Equals(variable.GetName(), n"developerMode") { variable.SetVisible(this.developerMode); };\n'''
          if needle not in s: raise SystemExit('visibility block not found')
          s = s.replace(needle, replacement, 1)
          insert_before = '  private func CycleExistingLine(forward: Bool) -> Void {\n'
          method = '''  private func RemoveSelectedBayPoint2() -> Void {\n    let quests: ref<QuestsSystem> = GameInstance.GetQuestsSystem(this.GetGameInstance());\n    let eventId: Int32;\n    let confirmation: ref<NCTCSurveyWriteConfirmationCallback>;\n    if !IsDefined(quests) { return; };\n    quests.SetFact(n"nctc_survey_capture_line", this.GetSelectedLineNumber());\n    quests.SetFact(n"nctc_survey_capture_stop_index", this.surveyStopIndex);\n    quests.SetFact(n"nctc_survey_event_session", quests.GetFact(n"nctc_survey_runtime_session"));\n    quests.SetFact(n"nctc_survey_event_kind", 10);\n    eventId = quests.GetFact(n"nctc_survey_event_id") + 1;\n    quests.SetFact(n"nctc_survey_write_ack_event_id", -1);\n    quests.SetFact(n"nctc_survey_event_id", eventId);\n    confirmation = new NCTCSurveyWriteConfirmationCallback();\n    confirmation.game = this.GetGameInstance();\n    confirmation.eventId = eventId;\n    confirmation.kind = "Bay Point 2 removal";\n    GameInstance.GetDelaySystem(this.GetGameInstance()).DelayCallback(confirmation, 0.50, false);\n    NCTCSettings.Notify(this.GetGameInstance(), "NCTC - Remove Bay Point 2 requested");\n  }\n\n'''
          if insert_before not in s: raise SystemExit('CycleExistingLine marker not found')
          s = s.replace(insert_before, method + insert_before, 1)
          p.write_text(s)

          p = Path('source/redscript/NCTC/NCTCTransitSystem.reds')
          s = p.read_text().replace('SetFact(n"nctc_dev_build_revision", 37413);', 'SetFact(n"nctc_dev_build_revision", 37414);', 1)
          p.write_text(s)
          PY
          git diff --check
          grep -q 'public let editBayPoint2: Bool = false;' source/redscript/NCTC/NCTCSettings.reds
          grep -q 'capture.berth2 = value' source/cet/nctc_survey/init.lua
          grep -q 'publish_vector("berth2", capture.berth2)' source/cet/nctc_survey/init.lua
          grep -q 'nctc_dev_build_revision", 37414' source/redscript/NCTC/NCTCTransitSystem.reds
      - name: Commit changes and remove builder
        shell: bash
        run: |
          rm -f .github/workflows/r374n-dual-bay-authoring-builder.yml
          git config user.name "NCTC build bot"
          git config user.email "nctc-build-bot@users.noreply.github.com"
          git add source/cet/nctc_survey/init.lua source/redscript/NCTC/NCTCSettings.reds source/redscript/NCTC/NCTCTransitSystem.reds .github/workflows/r374n-dual-bay-authoring-builder.yml
          git commit -m "feat: r374n dual-point bay authoring"
          git push origin HEAD:automation/r374n-dual-bay-authoring-builder
