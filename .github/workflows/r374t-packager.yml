name: r374t-packager
on:
  push:
    branches: ["automation/r374t-packager"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build devkit package
        shell: bash
        run: |
          set -euo pipefail
          OUT=package
          rm -rf "$OUT"
          mkdir -p "$OUT/r6/scripts/NCTC" "$OUT/r6/tweaks/NCTC" \
                   "$OUT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey" \
                   "$OUT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger" \
                   "$OUT/archive/pc/mod"
          cp source/redscript/NCTC/*.reds "$OUT/r6/scripts/NCTC/"
          cp source/tweaks/NCTC/* "$OUT/r6/tweaks/NCTC/"
          cp source/cet/nctc_survey/* "$OUT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp source/cet/nctc_passenger/* "$OUT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger/"
          cp source/archive/pc/mod/NCTCDisplayPrototype.archive "$OUT/archive/pc/mod/"
          cp source/archive/pc/mod/NCTCTrafficRuntime.archive "$OUT/archive/pc/mod/"
          cp README.md THIRD_PARTY_NOTICES.md "$OUT/"
          cat > "$OUT/NCTC_BUILD_INFO.txt" <<'EOF'
          Night City Transit Corporation devkit
          Build: r374t real-bus S-curve bay path
          Runtime: 37420
          Source commit: de4827c2f407660e4e01b97abec54a4a800b6521
          Branch: experiment/r374t-real-bus-s-curve-bay-path

          BAY TRAJECTORY
          - Keeps the two-point bay geometry and physical occupancy detection from r374s.
          - Point 1 / Point 2 are geometry anchors, not direct destinations.
          - Entry is generated as a rolling S-curve: ENTRY ATTACK -> COUNTER-STEER -> TRACK BAY.
          - ENTRY ATTACK deliberately aims slightly through the bay axis so the nose commits more decisively.
          - COUNTER-STEER brings the bus back onto the bay axis while the rear follows by off-tracking.
          - Pass-through buses stay on-axis until about 54% of the bay before beginning the exit maneuver.
          - EXIT ATTACK begins before Point 2, then REJOIN counter-steers toward the measured local road envelope.
          - Native traffic is restored only after the bus has crossed Point 2 and reached the explicit road rejoin target.

          SERVICE-STOP DEPARTURE
          - Departure now uses the same real-bus principle: steer toward the road before Point 2, then counter-steer after it.
          - No native traffic recovery while the bus is still deep/off-lane in the bay.

          OCCUPANCY
          - Physical Vehicle overlap remains authoritative.
          - Occupied bay remains a road bypass; the S-curve maneuver is not entered.
          EOF
          ZIP=NightCityTransitCorporation-0.3.0-devkit-r374t-real-bus-s-curve-bay-path-development.zip
          (cd "$OUT" && zip -qr "../$ZIP" .)
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          sha256sum "$OUT/archive/pc/mod/NCTCDisplayPrototype.archive" | tee display.sha256
          grep -q '37420' "$OUT/r6/scripts/NCTC/NCTCTransitSystem.reds"
          grep -q 'GetBayCounterTarget' "$OUT/r6/scripts/NCTC/NCTCTransitSystem.reds"
          grep -q 'GetBayExitAttackTarget' "$OUT/r6/scripts/NCTC/NCTCTransitSystem.reds"
          grep -q 'spatial.Overlap' "$OUT/r6/scripts/NCTC/NCTCTransitSystem.reds"
      - uses: actions/upload-artifact@v4
        with:
          name: r374t-devkit
          path: |
            NightCityTransitCorporation-0.3.0-devkit-r374t-real-bus-s-curve-bay-path-development.zip
            NightCityTransitCorporation-0.3.0-devkit-r374t-real-bus-s-curve-bay-path-development.zip.sha256
            display.sha256
          if-no-files-found: error
