name: r374m-builder

on:
  push:
    branches:
      - automation/r374m-builder

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply r374m
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('source/redscript/NCTC/NCTCTransitSystem.reds')
          s = p.read_text()
          def one(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1, found {s.count(old)}')
              s = s.replace(old, new, 1)

          one('SetFact(n"nctc_dev_build_revision", 37412);', 'SetFact(n"nctc_dev_build_revision", 37413);', 'revision')
          one('  private let berthManeuverStage: Int32;\n', '  private let berthManeuverStage: Int32;\n  // r374m: latched once a foreign vehicle is detected inside the authored bay.\n  // The stop is then served from the traffic lane and no direct bay command\n  // is allowed for the remainder of that stop.\n  private let berthBypassActive: Bool;\n', 'bypass field')

          one('''  private func GetBerthCorridorTarget() -> Vector4 {\n    return this.GetServiceBerth() + this.GetBerthForward() * 4.00;\n  }\n''', '''  // r374m: one continuous bay target. Keep a small 10% residue on the ROAD\n  // side of the berth axis so the direct driver never has a reason to cross\n  // the axis and counter-steer back (the visible Cannery/Delamain zigzag).\n  private func GetBerthCorridorTarget() -> Vector4 {\n    let forward: Vector4 = this.GetBerthForward();\n    let right: Vector4 = new Vector4(-forward.Y, forward.X, 0.00, 0.00);\n    return this.GetServiceBerth()\n      + forward * 4.00\n      - right * this.berthMergeSignedLateral * 0.10;\n  }\n''', 'corridor target')

          helper = '''  // r374m occupancy bridge. The dev CET scanner only answers whether a\n  // foreign vehicle occupies this oriented berth rectangle; routing decisions\n  // remain in REDscript.\n  private func PublishBerthOccupancyProbe(quests: ref<QuestsSystem>) -> Void {\n    let berth: Vector4;\n    let forward: Vector4;\n    if !IsDefined(quests) { return; };\n    if this.serviceStopId <= 0 || !this.hasSurveyProfile {\n      quests.SetFact(n"nctc_dev_service_berth_stop_id", 0);\n      return;\n    };\n    berth = this.GetServiceBerth();\n    forward = this.GetBerthForward();\n    quests.SetFact(n"nctc_dev_service_berth_stop_id", this.serviceStopId);\n    quests.SetFact(n"nctc_dev_service_berth_x_mm", Cast<Int32>(berth.X * 1000.00));\n    quests.SetFact(n"nctc_dev_service_berth_y_mm", Cast<Int32>(berth.Y * 1000.00));\n    quests.SetFact(n"nctc_dev_service_berth_z_mm", Cast<Int32>(berth.Z * 1000.00));\n    quests.SetFact(n"nctc_dev_service_berth_forward_x_mm", Cast<Int32>(forward.X * 1000.00));\n    quests.SetFact(n"nctc_dev_service_berth_forward_y_mm", Cast<Int32>(forward.Y * 1000.00));\n  }\n\n'''
          one('  private func PublishRouteDisplay(nextStopId: Int32) -> Void {\n', helper + '  private func PublishRouteDisplay(nextStopId: Int32) -> Void {\n', 'occupancy helper')

          # reset bypass in new request and despawn
          s = s.replace('    this.berthManeuverStage = 0;\n    this.berthMergeSignedLateral = 0.00;\n', '    this.berthManeuverStage = 0;\n    this.berthBypassActive = false;\n    this.berthMergeSignedLateral = 0.00;\n', 1)
          one('    this.departureManeuverActive = false;\n    this.legPolls = 0;\n', '    this.departureManeuverActive = false;\n    this.berthBypassActive = false;\n    this.legPolls = 0;\n', 'despawn reset')
          one('    quests = GameInstance.GetQuestsSystem(this.GetGameInstance());\n\n    // Stop state:', '    quests = GameInstance.GetQuestsSystem(this.GetGameInstance());\n    this.PublishBerthOccupancyProbe(quests);\n\n    // Stop state:', 'publish probe')

          old_depart = '''      // The called stop has now been served. r374k first leaves the bay with a\n      // direct arc toward the road line measured on entry. This lets the Mahir\n      // steer immediately from rest instead of asking traffic mode to relocate\n      // a parked off-lane vehicle.\n      this.serviceStopId = 0;\n      this.ArmDepartureManeuver();\n      if !this.AdvanceToNextStop() {\n        this.departureManeuverActive = false;\n        this.PublishLoopDiagnostic(34, 0);\n        this.ScheduleDispatch(1.00);\n        return;\n      };\n      this.arrived = false;\n      this.dwellPolls = 0;\n      this.legPolls = 0;\n      this.driveCommandSent = this.controller.DriveToBerthDirect(this.departureRoadTarget, 0.00);\n      this.PublishLoopDiagnostic(this.driveCommandSent ? 48 : 33, this.requestedStopId);\n      this.ScheduleDispatch(0.05);\n      return;\n'''
          new_depart = '''      // r374m: no hand-authored departure arc. After closing the doors,\n      // immediately return the Mahir to native traffic navigation.\n      this.serviceStopId = 0;\n      this.departureManeuverActive = false;\n      if !this.AdvanceToNextStop() {\n        this.PublishLoopDiagnostic(34, 0);\n        this.ScheduleDispatch(1.00);\n        return;\n      };\n      this.arrived = false;\n      this.dwellPolls = 0;\n      this.legPolls = 0;\n      this.driveCommandSent = this.controller.DriveToTraffic(this.GetTrafficTarget(), 0.00);\n      this.PublishLoopDiagnostic(this.driveCommandSent ? 49 : 33, this.requestedStopId);\n      this.ScheduleDispatch(0.25);\n      return;\n'''
          one(old_depart, new_depart, 'native departure')

          a = s.index('    // r374k: keep the stronger direct departure arc through roughly nine metres.')
          b = s.index('    this.legPolls += 1;', a)
          s = s[:a] + '    // r374m: departure is now entirely native traffic recovery.\n\n' + s[b:]

          occ = '''    // r374m: occupied bay => remain in traffic mode and serve from the road.\n    if !this.followingPassage && this.hasSurveyProfile && !this.berthBypassActive\n      && Equals(this.requestedStopId, this.serviceStopId)\n      && this.controller.IsNear(this.GetServiceBerth(), 60.00)\n      && Equals(quests.GetFact(n"nctc_dev_berth_occupancy_stop_id"), this.serviceStopId)\n      && Equals(quests.GetFact(n"nctc_dev_berth_occupied"), 1) {\n      this.berthBypassActive = true;\n      this.approachSlowdownApplied = false;\n      this.berthManeuverActive = false;\n      this.berthManeuverStage = 0;\n      this.PublishLoopDiagnostic(50, this.requestedStopId);\n    };\n\n'''
          one('    // r374g: traffic-mode speed fields proved non-authoritative.', occ + '    // r374g: traffic-mode speed fields proved non-authoritative.', 'occupancy gate')
          one('    if !this.followingPassage && this.hasSurveyProfile && !this.berthManeuverActive\n      && Equals(this.requestedStopId, this.serviceStopId)\n      && !this.approachSlowdownApplied {', '    if !this.followingPassage && this.hasSurveyProfile && !this.berthManeuverActive\n      && !this.berthBypassActive\n      && Equals(this.requestedStopId, this.serviceStopId)\n      && !this.approachSlowdownApplied {', 'brake bypass')

          entry_start = s.index('    // r374k early-nose berth entry.')
          entry_end = s.index('    // r374i: keep the stage-2 corridor command alive through arrival.', entry_start)
          entry = '''    // r374m single-command bay entry: no ENTRY->ALIGN retarget.\n    if !this.followingPassage && this.hasSurveyProfile && !this.berthManeuverActive\n      && !this.berthBypassActive\n      && Equals(this.requestedStopId, this.serviceStopId)\n      && this.controller.IsNear(this.GetServiceBerth(), 35.00)\n      && (AbsF(this.controller.GetCurrentSpeed()) >= 1.50 || this.approachSlowdownApplied)\n      && AbsF(this.controller.GetCurrentSpeed()) <= 8.00 {\n      let berthEntrySpeed: Float = AbsF(this.controller.GetCurrentSpeed());\n      let berthEntryLateral: Float;\n      let berthEntryLongitudinal: Float = this.GetBerthProgress(berthEntryLateral);\n      if berthEntryLongitudinal > 0.50 {\n        let berthForward: Vector4 = this.GetBerthForward();\n        let berthRight: Vector4 = new Vector4(-berthForward.Y, berthForward.X, 0.00, 0.00);\n        let berthDelta: Vector4 = this.GetServiceBerth() - this.controller.GetWorldPosition();\n        this.berthMergeSignedLateral = Vector4.Dot(berthDelta, berthRight);\n        this.berthManeuverActive = true;\n        this.berthManeuverStage = 2;\n        this.approachSlowdownApplied = false;\n        this.legPolls = 0;\n        this.driveCommandSent = this.controller.DriveToBerthDirect(this.GetBerthCorridorTarget(), berthEntrySpeed);\n        this.PublishLoopDiagnostic(this.driveCommandSent ? 43 : 33, this.requestedStopId);\n        this.ScheduleDispatch(0.05);\n        return;\n      };\n    };\n\n'''
          s = s[:entry_start] + entry + s[entry_end:]
          s = s.replace('    // r374i: keep the stage-2 corridor command alive through arrival.', '    // r374m: keep the single corridor command alive through arrival.', 1)
          one('    if this.controller.IsStoppedNear(this.GetServiceBerth(), 7.00) {', '    if this.controller.IsStoppedNear(this.GetServiceBerth(), this.berthBypassActive ? 12.00 : 7.00) {', 'bypass arrival radius')
          s = s.replace('        // Keep berthMergeSignedLateral through dwell: r374k reuses the measured\n        // road line for the immediate departure arc. AdvanceToNextStop resets it\n        // only after departureRoadTarget has been captured.\n', '        // r374m: preserve stop state through dwell; successor reset follows.\n', 1)
          adv = s.index('  private func AdvanceToNextStop() -> Bool {')
          tail = s[adv:]
          old = '    this.berthManeuverStage = 0;\n    this.berthMergeSignedLateral = 0.00;\n'
          if old not in tail: raise SystemExit('advance reset not found')
          tail = tail.replace(old, '    this.berthManeuverStage = 0;\n    this.berthBypassActive = false;\n    this.berthMergeSignedLateral = 0.00;\n', 1)
          s = s[:adv] + tail
          p.write_text(s)

          q = Path('source/cet/nctc_survey/init.lua')
          t = q.read_text()
          def lone(old, new, label):
              global t
              if t.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1, found {t.count(old)}')
              t = t.replace(old, new, 1)

          lone('local last_stale_drive_callback_id = 0\nlocal fact\n', '''local last_stale_drive_callback_id = 0\nlocal berth_scan_accumulator = 0.0\nlocal last_berth_occupancy_stop_id = -1\nlocal last_berth_occupancy_state = -1\nlocal fact\n''', 'scanner state')
          for old,new in [
            ('[43] = "route loop: r374l rolling early-nose ENTRY command sent",','[43] = "route loop: r374m single continuous BAY command sent",'),
            ('[44] = "route loop: r374l rolling ALIGN handoff sent",','[44] = "route loop: legacy ALIGN handoff (unexpected in r374m)",'),
            ('[45] = "route loop: legacy final BERTH command sent (unexpected in r374l)",','[45] = "route loop: legacy final BERTH command sent (unexpected in r374m)",'),
            ('[48] = "route loop: r374l strong immediate departure ARC sent",','[48] = "route loop: legacy departure ARC sent (unexpected in r374m)",'),
            ('[49] = "route loop: r374l late rolling departure handoff to traffic"','[49] = "route loop: r374m native lane recovery departure"')]:
              lone(old,new,'logger label')
          lone('    [49] = "route loop: r374m native lane recovery departure"\n  }', '    [49] = "route loop: r374m native lane recovery departure",\n    [50] = "route loop: r374m BAY OCCUPIED -> stay on road"\n  }', 'code 50')

          scanner = '''local function scan_service_berth_occupancy(quests, delta_time)\n  berth_scan_accumulator = berth_scan_accumulator + (tonumber(delta_time) or 0.0)\n  if berth_scan_accumulator < 0.20 then return end\n  berth_scan_accumulator = 0.0\n  local stop_id = fact(quests, "nctc_dev_service_berth_stop_id")\n  if stop_id <= 0 then\n    set_fact(quests, "nctc_dev_berth_occupancy_stop_id", 0)\n    set_fact(quests, "nctc_dev_berth_occupied", 0)\n    last_berth_occupancy_stop_id, last_berth_occupancy_state = -1, -1\n    return\n  end\n  local player = Game.GetPlayer()\n  if not player then return end\n  local bx = fact(quests, "nctc_dev_service_berth_x_mm") / 1000.0\n  local by = fact(quests, "nctc_dev_service_berth_y_mm") / 1000.0\n  local bz = fact(quests, "nctc_dev_service_berth_z_mm") / 1000.0\n  local fx = fact(quests, "nctc_dev_service_berth_forward_x_mm") / 1000.0\n  local fy = fact(quests, "nctc_dev_service_berth_forward_y_mm") / 1000.0\n  local flen = math.sqrt(fx*fx + fy*fy)\n  if flen < 0.50 then return end\n  fx, fy = fx/flen, fy/flen\n  local rx, ry = -fy, fx\n  local pp = player:GetWorldPosition()\n  local pdx, pdy = bx-pp.x, by-pp.y\n  local pd = math.sqrt(pdx*pdx + pdy*pdy)\n  if pd > 140.0 then return end\n  local occupied, occupant, olong, olat = 0, "", 0.0, 0.0\n  local ok = pcall(function()\n    local query = Game['TSQ_ALL;']()\n    query.maxDistance = math.max(25.0, math.min(150.0, pd + 18.0))\n    local parts = Game.GetTargetingSystem():GetTargetParts(player, query)\n    if not parts then return end\n    local seen = {}\n    for _, part in ipairs(parts) do\n      local entity = nil\n      pcall(function() entity = part:GetComponent():GetEntity() end)\n      if entity then\n        local eid = tostring(entity:GetEntityID())\n        if not seen[eid] then\n          seen[eid] = true\n          local vehicle = false\n          pcall(function() vehicle = GameObject.IsVehicle(entity) end)\n          if vehicle then\n            local rid = ""\n            pcall(function() rid = tostring(entity:GetRecordID().value) end)\n            if not string.find(rid, "nctc_service_mahir_mt28_coach", 1, true) then\n              local pos = entity:GetWorldPosition()\n              local dx, dy, dz = pos.x-bx, pos.y-by, pos.z-bz\n              local longitudinal = dx*fx + dy*fy\n              local lateral = dx*rx + dy*ry\n              if math.abs(longitudinal) <= 8.50 and math.abs(lateral) <= 2.60 and math.abs(dz) <= 2.50 then\n                occupied, occupant, olong, olat = 1, rid, longitudinal, lateral\n                break\n              end\n            end\n          end\n        end\n      end\n    end\n  end)\n  if not ok then occupied = 0 end\n  set_fact(quests, "nctc_dev_berth_occupancy_stop_id", stop_id)\n  set_fact(quests, "nctc_dev_berth_occupied", occupied)\n  if stop_id ~= last_berth_occupancy_stop_id or occupied ~= last_berth_occupancy_state then\n    last_berth_occupancy_stop_id, last_berth_occupancy_state = stop_id, occupied\n    if occupied == 1 then\n      log(string.format("berth occupancy stopId=%d OCCUPIED vehicle=%s local=(%.2f, %.2f)", stop_id, occupant, olong, olat))\n    else\n      log("berth occupancy stopId=" .. tostring(stop_id) .. " clear")\n    end\n  end\nend\n\n'''
          lone('local function log_build_revision(quests)\n', scanner + 'local function log_build_revision(quests)\n', 'scanner helper')
          lone('  if revision == 37412 then\n    log("NCTC runtime build=37412 r374l rolling bay handoff, no entry hesitation")', '  if revision == 37413 then\n    log("NCTC runtime build=37413 r374m single bay arc + native lane recovery + occupied-bay road stop")\n  elseif revision == 37412 then\n    log("NCTC runtime build=37412 r374l rolling bay handoff, no entry hesitation")', 'build marker')
          lone('registerForEvent("onUpdate", function()\n  local quests = Game.GetQuestsSystem()\n  if not quests then return end\n', 'registerForEvent("onUpdate", function(deltaTime)\n  local quests = Game.GetQuestsSystem()\n  if not quests then return end\n  scan_service_berth_occupancy(quests, deltaTime)\n', 'onUpdate scanner')
          q.write_text(t)
          PY

      - name: Validate r374m
        run: |
          grep -q 'nctc_dev_build_revision", 37413' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'berthBypassActive' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'r374m single-command bay entry' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'DriveToTraffic(this.GetTrafficTarget(), 0.00)' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'scan_service_berth_occupancy' source/cet/nctc_survey/init.lua
          grep -q 'runtime build=37413 r374m' source/cet/nctc_survey/init.lua

      - name: Commit feature and remove temporary workflow
        run: |
          git config user.name 'NCTC build bot'
          git config user.email 'nctc-build-bot@users.noreply.github.com'
          git rm .github/workflows/r374m-builder.yml
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m 'feat: r374m single bay arc and native lane recovery'
          git push origin HEAD:automation/r374m-builder
