name: r375a bay parking reset builder

on:
  push:
    branches:
      - automation/r375a-bay-parking-reset-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply r375a patch
        run: |
          python3 tools/r375a_reset_bay_parking.py
          grep -q 'nctc_dev_build_revision", 37501' source/redscript/NCTC/NCTCTransitSystem.reds
          ! grep -q 'berthManeuverActive' source/redscript/NCTC/NCTCTransitSystem.reds
          ! grep -q 'departureManeuverActive' source/redscript/NCTC/NCTCTransitSystem.reds
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'NCTC build bot'
          git config user.email 'nctc-build-bot@users.noreply.github.com'
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m 'feat: r375a reset bay parking controller'
          git push
