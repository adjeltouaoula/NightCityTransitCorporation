name: Materialize r389f unified interior choice

on:
  push:
    branches:
      - fix/native-stop-request-feature-v3

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-stop-request-feature-v3
          fetch-depth: 0

      - name: Materialize unified interior Interaction UI
        shell: python
        run: |
          from pathlib import Path

          passenger = Path('source/cet/nctc_passenger/init.lua')
          text = passenger.read_text(encoding='utf-8')

          replacements = [
            (
              'hub.title, hub.activityState, hub.hubPriority, hub.id = "Night City Bus Network", gameinteractionsvisEVisualizerActivityState.Active, 1, 77901',
              'hub.title, hub.activityState, hub.hubPriority, hub.id = "NIGHT CITY TRANSIT CORPORATION", gameinteractionsvisEVisualizerActivityState.Active, 1, 77901'
            ),
            (
              '    setFact("nctc_stop_request_choice_selected", 0)\n    setFact("nctc_seat_choice_visible", 0)\n',
              '    setFact("nctc_stop_request_choice_selected", 0)\n'
            ),
            (
              '''local function showChoice()\n    if not NCBN.interactionUI or #NCBN.offeredSeats == 0 then\n        if not NCBN.uiMissingLogged then print("[NCBN] Seat prompt waiting for InteractionUIBase."); NCBN.uiMissingLogged = true end\n        NCBN.choiceVisible = false\n        return\n    end\n    NCBN.uiMissingLogged = false\n    NCBN.choiceHub = makeChoiceHub()\n    setFact("nctc_seat_choice_visible", 1)\n''',
              '''local function showChoice()\n    local requestChoiceAvailable = isStopRequestChoiceAvailable()\n    if not NCBN.interactionUI or (#NCBN.offeredSeats == 0 and not requestChoiceAvailable) then\n        if not NCBN.uiMissingLogged and not NCBN.interactionUI then print("[NCBN] Interior choice prompt waiting for InteractionUIBase."); NCBN.uiMissingLogged = true end\n        NCBN.choiceVisible = false\n        setFact("nctc_stop_request_choice_selected", 0)\n        return\n    end\n    NCBN.uiMissingLogged = false\n    NCBN.choiceVisible = true\n    NCBN.choiceHub = makeChoiceHub()\n'''
            ),
            (
              'NCBN.selectedSeat = (NCBN.selectedSeat + (name == "ChoiceScrollUp" and 1 or -1)) % choiceCount',
              'NCBN.selectedSeat = (NCBN.selectedSeat + (name == "ChoiceScrollDown" and 1 or -1)) % choiceCount'
            ),
            (
              '''        hideChoice()\n        return\n    end\n    -- Mounting is asynchronous.''',
              '''        local seatsCleared = #NCBN.offeredSeats > 0\n        if seatsCleared then\n            NCBN.offeredSeats = {}\n            NCBN.selectedSeat = 0\n        end\n        local requestChoiceAvailable = isStopRequestChoiceAvailable()\n        local requestChanged = requestChoiceAvailable ~= NCBN.stopRequestChoiceAvailable\n        NCBN.stopRequestChoiceAvailable = requestChoiceAvailable\n        if aboard and requestChoiceAvailable then\n            if seatsCleared or requestChanged or not NCBN.choiceVisible then\n                showChoice()\n                print("[NCBN UI] seated request-only choice visible")\n            else\n                publishStopRequestChoiceSelection()\n            end\n        else\n            hideChoice()\n        end\n        return\n    end\n    -- Mounting is asynchronous.'''
            ),
            (
              '''    local seats = offeredSeats(bus, player)\n    local requestChoiceAvailable = isStopRequestChoiceAvailable()\n    if requestChoiceAvailable ~= NCBN.stopRequestChoiceAvailable then\n        NCBN.stopRequestChoiceAvailable = requestChoiceAvailable\n        local choiceCount = #seats + (requestChoiceAvailable and 1 or 0)\n        if choiceCount > 0 and NCBN.selectedSeat >= choiceCount then\n            NCBN.selectedSeat = choiceCount - 1\n        end\n        if NCBN.choiceVisible then showChoice() end\n    end\n    if not sameSeats(NCBN.offeredSeats, seats) then\n        hideChoice()\n        NCBN.offeredSeats, NCBN.selectedSeat = seats, 0\n        local names = {}\n        for _, seat in ipairs(seats) do table.insert(names, seat.id) end\n        print("[NCBN] Seat choices: " .. (#names > 0 and table.concat(names, ", ") or "none"))\n    end\n    if #seats > 0 and not NCBN.choiceVisible then\n        NCBN.choiceVisible = true\n        showChoice()\n    elseif #seats == 0 then hideChoice() end\nend)''',
              '''    local seats = offeredSeats(bus, player)\n    local seatsChanged = not sameSeats(NCBN.offeredSeats, seats)\n    local requestChoiceAvailable = isStopRequestChoiceAvailable()\n    local requestChanged = requestChoiceAvailable ~= NCBN.stopRequestChoiceAvailable\n\n    if seatsChanged then\n        NCBN.offeredSeats = seats\n        NCBN.selectedSeat = 0\n        local names = {}\n        for _, seat in ipairs(seats) do table.insert(names, seat.id) end\n        print("[NCBN UI] seat choices=" .. (#names > 0 and table.concat(names, ",") or "none"))\n    end\n\n    NCBN.stopRequestChoiceAvailable = requestChoiceAvailable\n    local choiceCount = #NCBN.offeredSeats + (requestChoiceAvailable and 1 or 0)\n    if choiceCount <= 0 then\n        hideChoice()\n        return\n    end\n\n    if NCBN.selectedSeat >= choiceCount then NCBN.selectedSeat = choiceCount - 1 end\n    if NCBN.selectedSeat < 0 then NCBN.selectedSeat = 0 end\n\n    if seatsChanged or requestChanged or not NCBN.choiceVisible then\n        showChoice()\n        print("[NCBN UI] choices=" .. tostring(choiceCount)\n            .. " seats=" .. tostring(#NCBN.offeredSeats)\n            .. " request=" .. tostring(requestChoiceAvailable)\n            .. " selected=" .. tostring(NCBN.selectedSeat))\n    else\n        publishStopRequestChoiceSelection()\n    end\nend)'''
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected one passenger replacement, found {count}: {old[:100]!r}')
            text = text.replace(old, new, 1)

          # The request is no longer a separately bound action. It is selected
          # through the same ChoiceScrollUp/Down + ChoiceApply interaction as a
          # seat or a line at a stop.
          passenger.write_text(text, encoding='utf-8')

          native = Path('source/redscript/NCTC/NCTCStopRequestNative.reds')
          native.write_text(r'''module NCTC

// Stop request is a normal Interaction UI choice. There is no dedicated NCTC
// key binding: arrows select it and vanilla ChoiceApply (F by default) invokes
// it, exactly like seat and line choices.

@addMethod(PlayerPuppet)
public func NCTCIsAboardServiceBus() -> Bool {
  let quests: ref<QuestsSystem> = GameInstance.GetQuestsSystem(this.GetGame());
  return IsDefined(quests) && Equals(quests.GetFact(n"nctc_player_in_service_bus"), 1);
}

@addMethod(PlayerPuppet)
public func NCTCShouldShowStopRequestChoice() -> Bool {
  let quests: ref<QuestsSystem> = GameInstance.GetQuestsSystem(this.GetGame());
  if !IsDefined(quests) { return false; };
  if !Equals(quests.GetFact(n"nctc_player_in_service_bus"), 1) { return false; };
  if Equals(quests.GetFact(n"nctc_display_stop_requested"), 1) { return false; };
  return true;
}

@addMethod(PlayerPuppet)
public func NCTCBuildStopRequestChoice() -> ListChoiceData {
  let choice: ListChoiceData;
  let choiceType: ChoiceTypeWrapper;
  ChoiceTypeWrapper.SetType(choiceType, gameinteractionsChoiceType.Selected);
  choice.localizedName = "Demander le prochain arrêt";
  choice.inputActionName = n"None";
  choice.type = choiceType;
  return choice;
}

// The passenger module owns one stable interior hub (77901) everywhere inside
// the bus. REDscript only appends the request entry to that hub when available;
// it never creates a competing standalone hub, which removes the previous
// flashing/focus fight between two UI owners.
@wrapMethod(InteractionUIBase)
protected cb func OnDialogsData(value: Variant) -> Bool {
  let player: ref<PlayerPuppet> = this.GetPlayerControlledObject() as PlayerPuppet;
  let data: DialogChoiceHubs;
  let hub: ListChoiceHubData;
  let i: Int32 = 0;
  let j: Int32;
  let requestChoiceFound: Bool;

  if !IsDefined(player) || !player.NCTCIsAboardServiceBus() {
    return wrappedMethod(value);
  };

  data = FromVariant<DialogChoiceHubs>(value);
  while i < ArraySize(data.choiceHubs) {
    hub = data.choiceHubs[i];
    if Equals(hub.id, 77901) {
      hub.title = "NIGHT CITY TRANSIT CORPORATION";
      if player.NCTCShouldShowStopRequestChoice() {
        requestChoiceFound = false;
        j = 0;
        while j < ArraySize(hub.choices) {
          if Equals(hub.choices[j].localizedName, "Demander le prochain arrêt") {
            requestChoiceFound = true;
            break;
          };
          j += 1;
        };
        if !requestChoiceFound {
          ArrayPush(hub.choices, player.NCTCBuildStopRequestChoice());
        };
      };
      data.choiceHubs[i] = hub;
    };
    i += 1;
  };

  return wrappedMethod(ToVariant(data));
}

@wrapMethod(PlayerPuppet)
protected cb func OnAction(action: ListenerAction, consumer: ListenerActionConsumer) -> Bool {
  let result: Bool = wrappedMethod(action, consumer);
  let quests: ref<QuestsSystem>;
  let transit: ref<NCTCTransitSystem>;

  if !ListenerAction.IsButtonJustPressed(action) || !Equals(ListenerAction.GetName(action), n"ChoiceApply") {
    return result;
  };

  quests = GameInstance.GetQuestsSystem(this.GetGame());
  if !IsDefined(quests)
    || !Equals(quests.GetFact(n"nctc_player_in_service_bus"), 1)
    || !Equals(quests.GetFact(n"nctc_stop_request_choice_selected"), 1)
    || !this.NCTCShouldShowStopRequestChoice() {
    return result;
  };

  consumer.Consume();
  quests.SetFact(n"nctc_stop_request_choice_selected", 0);
  transit = NCTCTransitSystem.Get(this.GetGame());
  if IsDefined(transit) {
    transit.RequestNextStop();
  };
  return result;
}
''', encoding='utf-8')

          for dead in [
            Path('source/input/nctc_stop_request.xml'),
            Path('source/redscript/NCTC/NCTCStopRequestSettings.reds'),
          ]:
            if dead.exists():
              dead.unlink()

      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source/input/nctc_stop_request.xml
          test ! -e source/redscript/NCTC/NCTCStopRequestSettings.reds
          grep -q 'ChoiceApply' source/redscript/NCTC/NCTCStopRequestNative.reds
          ! grep -q 'NCTC_RequestNextStop' source/redscript/NCTC/NCTCStopRequestNative.reds
          grep -q 'NIGHT CITY TRANSIT CORPORATION' source/cet/nctc_passenger/init.lua
          grep -q 'seated request-only choice visible' source/cet/nctc_passenger/init.lua

      - name: Commit materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/cet/nctc_passenger/init.lua source/redscript/NCTC/NCTCStopRequestNative.reds source/input/nctc_stop_request.xml source/redscript/NCTC/NCTCStopRequestSettings.reds
          git commit -m 'fix: unify interior stop request choice'
          git push origin HEAD:fix/native-stop-request-feature-v3
