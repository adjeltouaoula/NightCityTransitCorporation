name: r380a clean vanilla rejoin builder

on:
  push:
    branches:
      - automation/r380a-clean-vanilla-rejoin-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean r380a from validated r376f
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="411eadf5628fcbc4199feaa63fd0deaa122faf51"
          CLEAN_BRANCH="experiment/r380a-clean-vanilla-rejoin"
          CLEAN="$RUNNER_TEMP/r380a-clean"
          rm -rf "$CLEAN"
          git fetch origin "$CLEAN_BRANCH"
          git worktree prune
          git worktree add -B "$CLEAN_BRANCH" "$CLEAN" "origin/$CLEAN_BRANCH"
          test "$(git -C "$CLEAN" rev-parse HEAD)" = "$BASE_SHA"

          ARRIVAL_BEFORE="$(git -C "$CLEAN" hash-object source/archive/pc/mod/NCTCH2Spline.archive)"
          DEPARTURE_BEFORE="$(git -C "$CLEAN" hash-object source/archive/pc/mod/NCTCH2Departure.archive)"
          DISPLAY_BEFORE="$(sha256sum "$CLEAN/source/archive/pc/mod/NCTCDisplayPrototype.archive" | awk '{print $1}')"

          python3 - "$CLEAN" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          transit = root / 'source/redscript/NCTC/NCTCTransitSystem.reds'
          s = transit.read_text()

          def once(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label} match count={s.count(old)}')
              s = s.replace(old, new, 1)

          once(
          '  private let activeSplineCommand: ref<AIVehicleOnSplineCommand>;\n  private let driveGeneration: Int32;',
          '  private let activeSplineCommand: ref<AIVehicleOnSplineCommand>;\n  private let activeJoinTrafficCommand: ref<AIVehicleJoinTrafficCommand>;\n  private let driveGeneration: Int32;',
          'join field')

          once('GameInstance.GetQuestsSystem(this.bus.GetGame()).SetFact(n"nctc_dev_build_revision", 37606);',
               'GameInstance.GetQuestsSystem(this.bus.GetGame()).SetFact(n"nctc_dev_build_revision", 38001);',
               'revision')

          old_method = '''  // r376b: the departure spline has already completed successfully here,
  // so do not interrupt it again. Hand the measured rolling speed to the
  // normal traffic navigator through the established generation-safe pulse.
  public func DriveToTrafficAfterSpline(target: Vector4, minimumDistance: Float, startSpeed: Float) -> Bool {
    let callback: ref<NCTCDeferredDriveCommand>;
    let noDriver: ref<AIEvent>;
    let driverReady: ref<AIEvent>;
    let speedProfile: Int32;
    let speedLimit: Float;
    let generation: Int32;
    if !this.IsReady() { return false; };

    generation = this.NextDriveGeneration();
    this.previousRouteCommand = this.activeRouteCommand;
    this.activeRouteCommand = null;
    this.activeSplineCommand = null;

    noDriver = new AIEvent();
    driverReady = new AIEvent();
    noDriver.name = n"NoDriver";
    driverReady.name = n"DriverReady";
    GameInstance.GetDelaySystem(this.bus.GetGame()).DelayEventNextFrame(this.bus, noDriver);
    GameInstance.GetDelaySystem(this.bus.GetGame()).DelayEvent(this.bus, driverReady, 0.030);
    GameInstance.GetQuestsSystem(this.bus.GetGame()).SetFact(n"nctc_dev_command_forced_start_speed_mm", Cast<Int32>(MaxF(startSpeed, 0.00) * 1000.00));

    callback = new NCTCDeferredDriveCommand();
    speedLimit = this.ResolveTrafficSpeed(target, speedProfile);
    callback.Configure(this.bus, this, target, minimumDistance, speedLimit, speedProfile, MaxF(startSpeed, 0.00), generation);
    GameInstance.GetDelaySystem(this.bus.GetGame()).DelayCallback(callback, 0.060, false);
    return true;
  }
'''
          new_method = '''  // r380a: exact vanilla traffic rejoin. Delamain uses JoinTraffic with
  // needDriver=false and useKinematic=true when a parked taxi returns to free roam.
  // Do that first; only submit NCTC's route command once the vehicle is actually
  // registered on a traffic lane. No neighbor-snap and no driver-state pulse here.
  public func JoinTrafficVanillaAfterSpline() -> Bool {
    let command: ref<AIVehicleJoinTrafficCommand>;
    if !this.IsReady() { return false; };
    this.NextDriveGeneration();
    this.previousRouteCommand = this.activeRouteCommand;
    this.activeRouteCommand = null;
    this.activeSplineCommand = null;
    this.activeJoinTrafficCommand = null;
    command = new AIVehicleJoinTrafficCommand();
    command.needDriver = false;
    command.useKinematic = true;
    this.bus.GetAIComponent().SendCommand(command);
    this.activeJoinTrafficCommand = command;
    return true;
  }

  public func IsInTrafficLane() -> Bool {
    return this.IsReady() && this.bus.IsInTrafficLane();
  }

  public func IsJoinTrafficCommandSuccessful() -> Bool {
    return IsDefined(this.activeJoinTrafficCommand) && Equals(this.activeJoinTrafficCommand.state, AICommandState.Success);
  }

  public func IsJoinTrafficCommandFailed() -> Bool {
    if !IsDefined(this.activeJoinTrafficCommand) { return false; };
    return Equals(this.activeJoinTrafficCommand.state, AICommandState.Failure)
      || Equals(this.activeJoinTrafficCommand.state, AICommandState.Cancelled)
      || Equals(this.activeJoinTrafficCommand.state, AICommandState.Interrupted);
  }

  public func GetJoinTrafficCommandStatusCode() -> Int32 {
    if !IsDefined(this.activeJoinTrafficCommand) { return 0; };
    if this.IsJoinTrafficCommandSuccessful() { return 2; };
    if this.IsJoinTrafficCommandFailed() { return 3; };
    return 1;
  }

  public func DriveToTrafficFromJoinedLane(target: Vector4, minimumDistance: Float, startSpeed: Float) -> Bool {
    let callback: ref<NCTCDeferredDriveCommand>;
    let speedProfile: Int32;
    let speedLimit: Float;
    let generation: Int32;
    if !this.IsReady() { return false; };
    generation = this.NextDriveGeneration();
    this.previousRouteCommand = this.activeRouteCommand;
    this.activeRouteCommand = null;
    this.activeSplineCommand = null;
    this.bus.GetAIComponent().CancelOrInterruptCommand(n"AIVehicleJoinTrafficCommand", false, true);
    this.activeJoinTrafficCommand = null;
    GameInstance.GetQuestsSystem(this.bus.GetGame()).SetFact(n"nctc_dev_command_forced_start_speed_mm", Cast<Int32>(MaxF(startSpeed, 0.00) * 1000.00));
    callback = new NCTCDeferredDriveCommand();
    speedLimit = this.ResolveTrafficSpeed(target, speedProfile);
    callback.Configure(this.bus, this, target, minimumDistance, speedLimit, speedProfile, MaxF(startSpeed, 0.00), generation);
    GameInstance.GetDelaySystem(this.bus.GetGame()).DelayCallback(callback, 0.030, false);
    return true;
  }
'''
          once(old_method, new_method, 'post-spline method')

          old_success = '''      if this.controller.IsSplineCommandSuccessful() {
        let rollingSpeed: Float = AbsF(this.controller.GetCurrentSpeed());
        if !this.AdvanceToNextStop() {
          this.PublishLoopDiagnostic(34, 0);
          this.ScheduleDispatch(1.00);
          return;
        };
        this.legPolls = 0;
        this.bayParkingActive = false;
        this.bayParkingStage = 0;
        this.driveCommandSent = this.controller.DriveToTrafficAfterSpline(this.GetTrafficTarget(), 0.00, rollingSpeed);
        this.PublishLoopDiagnostic(this.driveCommandSent ? 74 : 33, this.requestedStopId);
        this.ScheduleDispatch(0.05);
        return;
      };'''
          new_success = '''      if this.controller.IsSplineCommandSuccessful() {
        let rollingSpeed: Float = AbsF(this.controller.GetCurrentSpeed());
        if !this.AdvanceToNextStop() {
          this.PublishLoopDiagnostic(34, 0);
          this.ScheduleDispatch(1.00);
          return;
        };
        this.legPolls = 0;
        this.bayParkingRetryCount = 0;
        if this.controller.IsInTrafficLane() {
          this.bayParkingActive = false;
          this.bayParkingStage = 0;
          this.driveCommandSent = this.controller.DriveToTrafficFromJoinedLane(this.GetTrafficTarget(), 0.00, rollingSpeed);
          this.PublishLoopDiagnostic(this.driveCommandSent ? 79 : 33, this.requestedStopId);
        } else {
          this.bayParkingStage = 14;
          this.driveCommandSent = this.controller.JoinTrafficVanillaAfterSpline();
          quests.SetFact(n"nctc_dev_join_traffic_state", this.controller.GetJoinTrafficCommandStatusCode());
          quests.SetFact(n"nctc_dev_bus_in_traffic_lane", 0);
          this.PublishLoopDiagnostic(this.driveCommandSent ? 76 : 33, this.requestedStopId);
        };
        this.ScheduleDispatch(0.10);
        return;
      };'''
          once(old_success, new_success, 'departure success')

          marker = '''    if this.bayParkingActive && Equals(this.bayParkingStage, 13) {
      this.ScheduleDispatch(0.25);
      return;
    };
'''
          join_stage = '''    if this.bayParkingActive && Equals(this.bayParkingStage, 14) {
      let inTrafficLane: Bool = this.controller.IsInTrafficLane();
      quests.SetFact(n"nctc_dev_join_traffic_state", this.controller.GetJoinTrafficCommandStatusCode());
      quests.SetFact(n"nctc_dev_bus_in_traffic_lane", inTrafficLane ? 1 : 0);
      if inTrafficLane {
        this.bayParkingRetryCount += 1;
      } else {
        this.bayParkingRetryCount = 0;
      };
      if this.controller.IsJoinTrafficCommandSuccessful() || this.bayParkingRetryCount >= 2 {
        let rollingSpeed: Float = AbsF(this.controller.GetCurrentSpeed());
        this.bayParkingActive = false;
        this.bayParkingStage = 0;
        this.legPolls = 0;
        this.driveCommandSent = this.controller.DriveToTrafficFromJoinedLane(this.GetTrafficTarget(), 0.00, rollingSpeed);
        this.PublishLoopDiagnostic(this.driveCommandSent ? 77 : 33, this.requestedStopId);
        this.ScheduleDispatch(0.05);
        return;
      };
      if this.controller.IsJoinTrafficCommandFailed() || this.legPolls >= 50 {
        this.legPolls = 0;
        this.bayParkingRetryCount = 0;
        this.driveCommandSent = this.controller.JoinTrafficVanillaAfterSpline();
        this.PublishLoopDiagnostic(this.driveCommandSent ? 78 : 33, this.requestedStopId);
        this.ScheduleDispatch(0.10);
        return;
      };
      this.ScheduleDispatch(0.10);
      return;
    };

'''
          once(marker, join_stage + marker, 'join stage')

          s = s.replace('// These must remain false for the service bus. Enabling either one lets\n    // the traffic controller snap the long Mahir to a neighboring lane when\n    // a route command starts or ends, which can eject standing passengers.',
                        '// Keep neighbor snapping disabled for the service bus: it can visibly\n    // teleport the long Mahir sideways, which is not acceptable RP.', 1)
          transit.write_text(s)

          cet = root / 'source/cet/nctc_survey/init.lua'
          c = cet.read_text()
          old = '    [74] = "route loop: r376b H2 spline exit -> native traffic handoff",\n    [75] = "route loop: r376b H2 native departure spline FAILED"'
          new = '    [74] = "route loop: r376b H2 spline exit -> native traffic handoff",\n    [75] = "route loop: r376b H2 native departure spline FAILED",\n    [76] = "route loop: r380a exact vanilla JoinTraffic armed",\n    [77] = "route loop: r380a traffic lane acquired -> route command",\n    [78] = "route loop: r380a vanilla JoinTraffic retry",\n    [79] = "route loop: r380a already lane-attached -> route command"'
          if c.count(old) != 1: raise SystemExit('CET state labels match failed')
          c = c.replace(old, new, 1)
          old = '  if code == 29 or code == 31 or code == 32 or code == 41 or code == 46 then'
          extra = '''  if code == 76 or code == 77 or code == 78 or code == 79 then
    local join_states = { [0] = "missing", [1] = "active", [2] = "success", [3] = "failed/cancelled" }
    command_extra = command_extra
      .. " joinState=" .. (join_states[fact(quests, "nctc_dev_join_traffic_state")] or "unknown")
      .. " inTrafficLane=" .. tostring(fact(quests, "nctc_dev_bus_in_traffic_lane"))
  end
'''
          if c.count(old) != 1: raise SystemExit('CET command extra insertion failed')
          c = c.replace(old, extra + old, 1)
          old_codes = 'or code == 60 or code == 61 or code == 62 or code == 63 or code == 64 or code == 65 or code == 66 or code == 67 or code == 68 or code == 69 or code == 70 or code == 71 or code == 72 or code == 73 or code == 74 or code == 75 then'
          new_codes = 'or code == 60 or code == 61 or code == 62 or code == 63 or code == 64 or code == 65 or code == 66 or code == 67 or code == 68 or code == 69 or code == 70 or code == 71 or code == 72 or code == 73 or code == 74 or code == 75 or code == 76 or code == 77 or code == 78 or code == 79 then'
          if c.count(old_codes) != 1: raise SystemExit('CET code list failed')
          c = c.replace(old_codes, new_codes, 1)
          old_rev = '  if revision == 37606 then\n    log("NCTC runtime build=37606 r376f H2 final nose clearance")'
          new_rev = '  if revision == 38001 then\n    log("NCTC runtime build=38001 r380a clean exact-vanilla traffic rejoin")\n  elseif revision == 37606 then\n    log("NCTC runtime build=37606 r376f H2 final nose clearance")'
          if c.count(old_rev) != 1: raise SystemExit('CET revision failed')
          c = c.replace(old_rev, new_rev, 1)
          cet.write_text(c)
          PY

          grep -Fq 'command.useKinematic = true;' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"
          grep -Fq 'JoinTrafficVanillaAfterSpline' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"
          grep -Fq 'DriveToTrafficFromJoinedLane' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"
          grep -Fq 'nctc_dev_build_revision", 38001' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"
          ! grep -Fq 'DriveToTrafficAfterSpline(this.GetTrafficTarget()' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"
          test "$(git -C "$CLEAN" hash-object source/archive/pc/mod/NCTCH2Spline.archive)" = "$ARRIVAL_BEFORE"
          test "$(git -C "$CLEAN" hash-object source/archive/pc/mod/NCTCH2Departure.archive)" = "$DEPARTURE_BEFORE"
          test "$(sha256sum "$CLEAN/source/archive/pc/mod/NCTCDisplayPrototype.archive" | awk '{print $1}')" = "$DISPLAY_BEFORE"

          mapfile -t CHANGED < <(git -C "$CLEAN" diff --name-only)
          test "${#CHANGED[@]}" -eq 2
          printf '%s\n' "${CHANGED[@]}" | grep -Fxq 'source/redscript/NCTC/NCTCTransitSystem.reds'
          printf '%s\n' "${CHANGED[@]}" | grep -Fxq 'source/cet/nctc_survey/init.lua'

          git -C "$CLEAN" config user.name "github-actions[bot]"
          git -C "$CLEAN" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$CLEAN" add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git -C "$CLEAN" commit -m "feat: r380a clean exact vanilla traffic rejoin"
          CLEAN_SHA="$(git -C "$CLEAN" rev-parse HEAD)"
          git -C "$CLEAN" push origin "HEAD:refs/heads/$CLEAN_BRANCH"
          test "$(git -C "$CLEAN" rev-list --count "$BASE_SHA..$CLEAN_SHA")" -eq 1

          ROOT="$RUNNER_TEMP/nctc-r380a"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/archive/pc/mod" "$ROOT/r6/scripts/NCTC" "$ROOT/r6/tweaks/NCTC"
          mkdir -p "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey"
          mkdir -p "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger"
          cp "$CLEAN"/source/archive/pc/mod/*.archive "$ROOT/archive/pc/mod/"
          cp "$CLEAN"/source/archive/pc/mod/*.archive.xl "$ROOT/archive/pc/mod/"
          cp "$CLEAN"/source/redscript/NCTC/*.reds "$ROOT/r6/scripts/NCTC/"
          cp "$CLEAN"/source/tweaks/NCTC/* "$ROOT/r6/tweaks/NCTC/"
          cp "$CLEAN/source/cet/nctc_survey/init.lua" "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp "$CLEAN/source/cet/nctc_survey/nctc_network.default.json" "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp "$CLEAN/source/cet/nctc_survey/nctc_survey_settings.json" "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp "$CLEAN"/source/cet/nctc_passenger/* "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger/"
          cp "$CLEAN/README.md" "$CLEAN/THIRD_PARTY_NOTICES.md" "$ROOT/"

          ZIP="$RUNNER_TEMP/NightCityTransitCorporation-0.3.0-devkit-r380a-clean-vanilla-rejoin-development.zip"
          (cd "$ROOT" && zip -qr "$ZIP" .)
          unzip -t "$ZIP" >/dev/null
          sha256sum "$ZIP" | tee "$RUNNER_TEMP/SHA256.txt"
          printf 'CLEAN_SHA=%s\nARRIVAL_BLOB=%s\nDEPARTURE_BLOB=%s\nDISPLAY_SHA=%s\n' \
            "$CLEAN_SHA" "$ARRIVAL_BEFORE" "$DEPARTURE_BEFORE" "$DISPLAY_BEFORE" > "$RUNNER_TEMP/METADATA.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r380a-clean-vanilla-rejoin
          path: |
            ${{ runner.temp }}/NightCityTransitCorporation-0.3.0-devkit-r380a-clean-vanilla-rejoin-development.zip
            ${{ runner.temp }}/SHA256.txt
            ${{ runner.temp }}/METADATA.txt
