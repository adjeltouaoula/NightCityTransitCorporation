name: r380a clean vanilla rejoin builder

on:
  push:
    branches:
      - automation/r380a-clean-vanilla-rejoin-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build r380a
        run: python3 tools/r380a/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r380a-clean-vanilla-rejoin
          path: |
            ${{ runner.temp }}/NightCityTransitCorporation-0.3.0-devkit-r380a-clean-vanilla-rejoin-development.zip
            ${{ runner.temp }}/SHA256.txt
            ${{ runner.temp }}/METADATA.txt
