name: r374r builder

on:
  push:
    branches:
      - automation/r374r-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply r374r patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          data = ''''''
          open('/tmp/r374r.patch','wb').write(zlib.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/r374r.patch
          git apply /tmp/r374r.patch
          git diff --check
          git config user.name "NCTC build bot"
          git config user.email "nctc-build-bot@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m "fix: r374r early bay entry and native vehicle overlap"
          git push origin HEAD:automation/r374r-builder
