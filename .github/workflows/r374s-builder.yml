name: r374s builder

on:
  push:
    branches:
      - automation/r374s-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply r374s patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          transit = Path('source/redscript/NCTC/NCTCTransitSystem.reds')
          s = transit.read_text()

          def rep(old, new, count=None):
              global s
              n = s.count(old)
              expected = count if count is not None else 1
              if n != expected:
                  raise SystemExit(f'expected {expected} occurrences, found {n}: {old[:80]!r}')
              s = s.replace(old, new)

          rep('GameInstance.GetQuestsSystem(this.bus.GetGame()).SetFact(n"nctc_dev_build_revision", 37418);',
              'GameInstance.GetQuestsSystem(this.bus.GetGame()).SetFact(n"nctc_dev_build_revision", 37419);')

          rep('  private let berthMergeSignedLateral: Float;\n  private let departureManeuverActive: Bool;',
              '  private let berthMergeSignedLateral: Float;\n  // r374s: signed local road-side offset captured when the bus actually reaches Point 1.\n  // Unlike berthMergeSignedLateral, this is not polluted by a distant/curved approach.\n  private let berthGateRoadSignedLateral: Float;\n  private let departureManeuverActive: Bool;')

          # Reset the new local road offset everywhere a new service/leg clears the old merge state.
          old_reset = '    this.berthMergeSignedLateral = 0.00;\n'
          reset_count = s.count(old_reset)
          if reset_count < 2:
              raise SystemExit(f'expected at least 2 berth merge resets, found {reset_count}')
          s = s.replace(old_reset, old_reset + '    this.berthGateRoadSignedLateral = 0.00;\n')

          rep('''  private func GetBayEntryLeadTarget() -> Vector4 {
    let entry: Vector4 = this.GetBayEntryPoint();
    let forward: Vector4 = this.GetBayForward();
    let length: Float = Vector4.Distance(this.GetBayEntryPoint(), this.GetBayExitPoint());
    let lead: Float = ClampF(length * 0.28, 7.00, 10.00);
    return entry + forward * lead;
  }
''', '''  private func GetBayEntryLeadTarget() -> Vector4 {
    let entry: Vector4 = this.GetBayEntryPoint();
    let forward: Vector4 = this.GetBayForward();
    let length: Float = Vector4.Distance(this.GetBayEntryPoint(), this.GetBayExitPoint());
    // r374s: Point 1 is now a real entry gate. Aim only a couple of metres
    // inside it so the Mahir must steer into the opening instead of cutting a
    // shallow chord toward a point 7-10 m down the bay.
    let lead: Float = ClampF(length * 0.08, 2.00, 3.00);
    return entry + forward * lead;
  }
''')

          rep('''  // Reuse the road-side offset measured when the bus leaves traffic for the
  // bay.  The target is capped so a curved/diagonal bay such as Delamain does
  // not ask the long Mahir to jump an entire lane in one steering input.
  private func GetBayRoadRejoinTarget() -> Vector4 {
    let forward: Vector4 = this.GetBayForward();
    let right: Vector4 = new Vector4(-forward.Y, forward.X, 0.00, 0.00);
    let roadLateral: Float = ClampF(-this.berthMergeSignedLateral * 0.55, -6.00, 6.00);
    return this.GetBayExitPoint() + forward * 6.00 + right * roadLateral;
  }
''', '''  // r374s: rejoin the LOCAL road envelope measured at Point 1, not the
  // distant approach offset. This keeps Delamain from crossing a whole lane
  // while still giving parallel bays enough steering angle to clear the curb.
  private func GetBayRoadRejoinTarget() -> Vector4 {
    let forward: Vector4 = this.GetBayForward();
    let right: Vector4 = new Vector4(-forward.Y, forward.X, 0.00, 0.00);
    let measured: Float = this.berthGateRoadSignedLateral;
    let roadLateral: Float;
    if AbsF(measured) >= 1.25 {
      roadLateral = measured > 0.00
        ? ClampF(measured * 1.05, 2.50, 3.75)
        : ClampF(measured * 1.05, -3.75, -2.50);
    } else {
      // Compatibility fallback if an old save reaches departure without a
      // captured gate sample. Never allow the distant approach to request
      // more than one modest lane-width correction.
      roadLateral = ClampF(-this.berthMergeSignedLateral * 0.20, -2.50, 2.50);
    };
    // A shorter longitudinal lead gives the long bus a stronger steering
    // angle immediately after doors close instead of running along the curb.
    return this.GetBayExitPoint() + forward * 4.00 + right * roadLateral;
  }
''')

          rep('''      if this.controller.IsNear(this.departureRoadTarget, 3.00) {
        this.departureManeuverActive = false; this.legPolls = 0;
''', '''      if this.controller.IsNear(this.departureRoadTarget, 2.50) && departureProgress >= 1.50 {
        this.departureManeuverActive = false; this.legPolls = 0;
''')

          rep('''      if entryLongitudinal > 0.50
        && entryDistance <= 42.00
        && (entryLateral <= 18.50 || entryDistance <= 25.00) {
''', '''      if entryLongitudinal > 0.50
        && entryDistance <= 60.00
        && (entryLateral <= 18.50 || entryDistance <= 25.00) {
''')

          rep('''      let entryCrossTrack: Float = AbsF(Vector4.Dot(entryDelta, entryRight));
      let entrySpeed: Float = MinF(AbsF(this.controller.GetCurrentSpeed()), 7.00);
      if entered >= -1.50 && entryCrossTrack <= 6.00 {
        let corridorTarget: Vector4;
        this.berthWasEntered = true;
''', '''      let entrySignedCrossTrack: Float = Vector4.Dot(entryDelta, entryRight);
      let entryCrossTrack: Float = AbsF(entrySignedCrossTrack);
      let entrySpeed: Float = MinF(AbsF(this.controller.GetCurrentSpeed()), 7.00);
      // Do not hand off merely because the pivot passed the longitudinal gate.
      // Require the bus to have actually converged onto the bay mouth first.
      if entered >= -2.50 && entryCrossTrack <= 3.50 {
        let corridorTarget: Vector4;
        this.berthGateRoadSignedLateral = entrySignedCrossTrack;
        this.berthWasEntered = true;
''')

          rep('    quests.SetFact(n"nctc_dev_loop_berth_merge_lateral_mm", Cast<Int32>(this.berthMergeSignedLateral * 1000.00));\n',
              '    quests.SetFact(n"nctc_dev_loop_berth_merge_lateral_mm", Cast<Int32>(this.berthMergeSignedLateral * 1000.00));\n    quests.SetFact(n"nctc_dev_loop_berth_gate_road_lateral_mm", Cast<Int32>(this.berthGateRoadSignedLateral * 1000.00));\n')

          transit.write_text(s)

          cet = Path('source/cet/nctc_survey/init.lua')
          t = cet.read_text()
          def rep_t(old, new, count=None):
              global t
              n = t.count(old)
              expected = count if count is not None else 1
              if n != expected:
                  raise SystemExit(f'expected {expected} CET occurrences, found {n}: {old[:80]!r}')
              t = t.replace(old, new)

          rep_t('  local berth_merge_lateral = fact(quests, "nctc_dev_loop_berth_merge_lateral_mm") / 1000.0\n',
                '  local berth_merge_lateral = fact(quests, "nctc_dev_loop_berth_merge_lateral_mm") / 1000.0\n  local berth_gate_road_lateral = fact(quests, "nctc_dev_loop_berth_gate_road_lateral_mm") / 1000.0\n')
          rep_t('[43] = "route loop: r374r ENTRY_GATE direct command sent",', '[43] = "route loop: r374s early POINT1_GATE direct command sent",')
          rep_t('[44] = "route loop: r374r entry gate -> bay corridor/rejoin handoff",', '[44] = "route loop: r374s Point1 gate -> bay corridor handoff",')
          rep_t('[47] = "route loop: legacy road brake (unexpected in r374r)",', '[47] = "route loop: legacy road brake (unexpected in r374s)",')
          rep_t('[48] = "route loop: r374r direct road-rejoin departure",', '[48] = "route loop: r374s local-gate road rejoin departure",')
          rep_t('[49] = "route loop: r374r traffic handoff after road rejoin",', '[49] = "route loop: r374s traffic handoff after local road rejoin",')
          rep_t('[50] = "route loop: r374r native Vehicle overlap -> stay on road"', '[50] = "route loop: r374s native Vehicle overlap -> stay on road"')
          rep_t('      .. " mergeLat=" .. string.format("%.2fm", berth_merge_lateral)\n',
                '      .. " mergeLat=" .. string.format("%.2fm", berth_merge_lateral)\n      .. " gateRoadLat=" .. string.format("%.2fm", berth_gate_road_lateral)\n')
          rep_t('''  if revision == 37418 then
    log("NCTC runtime build=37418 r374r entry-gate + native bay overlap + road rejoin")
''', '''  if revision == 37419 then
    log("NCTC runtime build=37419 r374s early Point1 gate + local road rejoin")
  elseif revision == 37418 then
    log("NCTC runtime build=37418 r374r entry-gate + native bay overlap + road rejoin")
''')
          cet.write_text(t)
          PY

          git config user.name "NCTC build bot"
          git config user.email "nctc-build-bot@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m "fix: r374s early Point1 gate and local road rejoin"
          git push origin HEAD:automation/r374s-builder
