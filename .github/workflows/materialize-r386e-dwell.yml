name: materialize r386e requested stop dwell

on:
  push:
    branches:
      - fix/r386e-requested-stop-15s-dwell
    paths:
      - .github/workflows/materialize-r386e-dwell.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set passenger-request dwell to 15 seconds
        shell: python
        run: |
          from pathlib import Path

          path = Path('source/redscript/NCTC/NCTCTransitSystem.reds')
          text = path.read_text(encoding='utf-8')
          old = '''      // Always leave enough time for the door animation to be visible.\n      if this.dwellPolls < 8 {\n        this.dwellPolls += 1;\n        this.ScheduleDispatch(0.25);\n        return;\n      };\n      if !boarded && this.dwellPolls < 40 {\n        this.dwellPolls += 1;\n        this.ScheduleDispatch(0.25);\n        return;\n      };'''
          new = '''      // Passenger-requested stops are deliberate alighting stops. Give V a\n      // full 15 seconds from the moment service dwell begins, regardless of\n      // the fact that V is already detected aboard. The initial call/boarding\n      // stop keeps the previous shorter/conditional dwell semantics.\n      if this.passengerStopRequested && this.dwellPolls < 60 {\n        this.dwellPolls += 1;\n        this.ScheduleDispatch(0.25);\n        return;\n      };\n      // Always leave enough time for the door animation to be visible.\n      if !this.passengerStopRequested && this.dwellPolls < 8 {\n        this.dwellPolls += 1;\n        this.ScheduleDispatch(0.25);\n        return;\n      };\n      if !this.passengerStopRequested && !boarded && this.dwellPolls < 40 {\n        this.dwellPolls += 1;\n        this.ScheduleDispatch(0.25);\n        return;\n      };'''
          if old not in text:
              raise SystemExit('expected dwell block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify source shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'this.passengerStopRequested && this.dwellPolls < 60' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q '!this.passengerStopRequested && this.dwellPolls < 8' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q '!this.passengerStopRequested && !boarded && this.dwellPolls < 40' source/redscript/NCTC/NCTCTransitSystem.reds

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/redscript/NCTC/NCTCTransitSystem.reds
          git commit -m 'fix: hold passenger-requested stops for 15 seconds'
          git push origin HEAD:fix/r386e-requested-stop-15s-dwell
