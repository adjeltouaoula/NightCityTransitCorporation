name: r374u calibration builder

on:
  push:
    branches:
      - automation/r374u-calibration-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply r374u calibration patch
        run: python3 tools/r374u_patch.py
      - name: Commit source
        run: |
          git config user.name "NCTC build bot"
          git config user.email "nctc-build-bot@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCSettings.reds source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m "feat: r374u bay width calibration authoring"
          git push origin HEAD:automation/r374u-calibration-builder
