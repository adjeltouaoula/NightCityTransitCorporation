name: r376a native spline builder

on:
  push:
    branches:
      - automation/r376a-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/r376a-builder
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patch NCTC source
        run: python3 tools/r376a_builder_patch.py
      - name: Generate H2 native spline archive
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r376a-world"
          RAW="$WORK/NCTCH2Spline"
          OUT="$WORK/out"
          mkdir -p "$WORK/src" "$RAW/nctc/bays/h2/sectors" "$OUT" source/archive/pc/mod
          cd "$WORK/src"
          dotnet new console --framework net10.0 --force
          dotnet add package WolvenKit.RED4 --version 9.0.1
          cp "$GITHUB_WORKSPACE/tools/r376a_world/Program.cs" Program.cs
          RAW_ROOT="$RAW" dotnet run -c Release
          dotnet tool install WolvenKit.CLI --version 9.0.1 --tool-path "$WORK/tools"
          "$WORK/tools/cp77tools" pack "$RAW" -o "$OUT"
          test -s "$OUT/NCTCH2Spline.archive"
          cd "$GITHUB_WORKSPACE"
          cp "$OUT/NCTCH2Spline.archive" source/archive/pc/mod/NCTCH2Spline.archive
          printf '%s\n' 'streaming:' '  blocks:' '    - nctc\bays\h2\all.streamingblock' > source/archive/pc/mod/NCTCH2Spline.archive.xl
          test "$(sha256sum source/archive/pc/mod/NCTCDisplayPrototype.archive | awk '{print $1}')" = "09a8fb10c2e027b2250c1ec647f8c3d466129bea907f5421771795093ae37d0a"
      - name: Commit r376a generated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NCTC build bot"
          git config user.email "nctc-build-bot@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua source/archive/pc/mod/NCTCH2Spline.archive source/archive/pc/mod/NCTCH2Spline.archive.xl
          git diff --cached --stat
          git commit -m "feat: r376a H2 native spline arrival"
          git push origin HEAD:automation/r376a-builder
