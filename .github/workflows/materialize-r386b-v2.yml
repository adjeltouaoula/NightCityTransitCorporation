name: materialize r386b source v2

on:
  push:
    branches:
      - fix/r386b-post-join-driver-pulse
    paths:
      - .github/workflows/materialize-r386b-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python3 tools/ci/materialize_r386b_post_join.py
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'nctc_dev_build_revision", 38602' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'DelayEventNextFrame(this.bus, noDriver)' source/redscript/NCTC/NCTCTransitSystem.reds
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCTransitSystem.reds
          git commit -m "fix: restore driver lifecycle after JoinTraffic"
          git push origin HEAD:fix/r386b-post-join-driver-pulse
