name: r389d combined stop request and seat navigation

on:
  push:
    branches:
      - fix/native-stop-request-feature-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch passenger choice navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/cet/nctc_passenger/init.lua')
          s = p.read_text(encoding='utf-8')

          old = '''    hubChoiceVisible = false, hubChoiceHub = nil, hubChoices = {}, selectedHubLine = 0,\n    hubChoiceRevision = -1, lastInsideLocal = nil }'''
          new = '''    hubChoiceVisible = false, hubChoiceHub = nil, hubChoices = {}, selectedHubLine = 0,\n    hubChoiceRevision = -1, lastInsideLocal = nil, stopRequestChoiceAvailable = false }'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              assert new in s

          old = '''local function signalTransitSystem(value)'''
          insert = '''local function isStopRequestChoiceAvailable()\n    return getFact("nctc_player_in_service_bus") == 1 and getFact("nctc_display_stop_requested") ~= 1\nend\n\nlocal function publishStopRequestChoiceSelection()\n    local selected = NCBN.choiceVisible and isStopRequestChoiceAvailable() and NCBN.selectedSeat == #NCBN.offeredSeats\n    setFact("nctc_stop_request_choice_selected", selected and 1 or 0)\nend\n\nlocal function signalTransitSystem(value)'''
          if old in s and 'local function isStopRequestChoiceAvailable()' not in s:
              s = s.replace(old, insert, 1)
          else:
              assert 'local function isStopRequestChoiceAvailable()' in s

          old = '''local function hideChoice()\n    if not NCBN.choiceVisible then return end\n    NCBN.choiceVisible, NCBN.choiceHub = false, nil'''
          new = '''local function hideChoice()\n    setFact("nctc_stop_request_choice_selected", 0)\n    if not NCBN.choiceVisible then return end\n    NCBN.choiceVisible, NCBN.choiceHub = false, nil'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              assert new in s

          old = '''    blackboard:SetInt(defs.ActiveChoiceHubID, NCBN.choiceHub.id)\n    local data = blackboard:GetVariant(defs.DialogChoiceHubs)\n    NCBN.interactionUI:OnDialogsSelectIndex(NCBN.selectedSeat)'''
          new = '''    blackboard:SetInt(defs.ActiveChoiceHubID, NCBN.choiceHub.id)\n    local data = blackboard:GetVariant(defs.DialogChoiceHubs)\n    publishStopRequestChoiceSelection()\n    NCBN.interactionUI:OnDialogsSelectIndex(NCBN.selectedSeat)'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              assert new in s

          old = '''        elseif NCBN.choiceVisible and name == "ChoiceApply" then\n            NCBN.inputLocked = true; consumer:Consume(); mountPassenger(NCBN.offeredSeats[NCBN.selectedSeat + 1])\n        elseif NCBN.choiceVisible and (name == "ChoiceScrollUp" or name == "ChoiceScrollDown") then\n            NCBN.inputLocked = true; consumer:Consume()\n            NCBN.selectedSeat = (NCBN.selectedSeat + (name == "ChoiceScrollUp" and 1 or -1)) % #NCBN.offeredSeats'''
          new = '''        elseif NCBN.choiceVisible and name == "ChoiceApply" then\n            -- The REDscript layer appends the stop-request choice after the\n            -- seat choices. Leave ChoiceApply unconsumed on that final index\n            -- so native NCTC input handles the request; seat indices retain\n            -- the exact validated mounting path.\n            if isStopRequestChoiceAvailable() and NCBN.selectedSeat == #NCBN.offeredSeats then\n                setFact("nctc_stop_request_choice_selected", 1)\n                return\n            end\n            NCBN.inputLocked = true; consumer:Consume(); mountPassenger(NCBN.offeredSeats[NCBN.selectedSeat + 1])\n        elseif NCBN.choiceVisible and (name == "ChoiceScrollUp" or name == "ChoiceScrollDown") then\n            NCBN.inputLocked = true; consumer:Consume()\n            local choiceCount = #NCBN.offeredSeats + (isStopRequestChoiceAvailable() and 1 or 0)\n            if choiceCount > 0 then\n                NCBN.selectedSeat = (NCBN.selectedSeat + (name == "ChoiceScrollUp" and 1 or -1)) % choiceCount\n            end\n            publishStopRequestChoiceSelection()\n            showChoice()'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              assert new in s

          old = '''    local seats = offeredSeats(bus, player)\n    if not sameSeats(NCBN.offeredSeats, seats) then'''
          new = '''    local seats = offeredSeats(bus, player)\n    local requestChoiceAvailable = isStopRequestChoiceAvailable()\n    if requestChoiceAvailable ~= NCBN.stopRequestChoiceAvailable then\n        NCBN.stopRequestChoiceAvailable = requestChoiceAvailable\n        local choiceCount = #seats + (requestChoiceAvailable and 1 or 0)\n        if choiceCount > 0 and NCBN.selectedSeat >= choiceCount then\n            NCBN.selectedSeat = choiceCount - 1\n        end\n        if NCBN.choiceVisible then showChoice() end\n    end\n    if not sameSeats(NCBN.offeredSeats, seats) then'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              assert new in s

          # Scope / regression guards.
          assert 'local function isStopRequestChoiceAvailable()' in s
          assert 'nctc_stop_request_choice_selected' in s
          assert 'choiceCount = #NCBN.offeredSeats + (isStopRequestChoiceAvailable() and 1 or 0)' in s
          assert 'mountPassenger(NCBN.offeredSeats[NCBN.selectedSeat + 1])' in s
          assert 'ObserveBefore("PlayerPuppet", "OnCarHitPlayer"' in s
          assert 'setBoardingDoor(bus, boardingAllowed' in s
          p.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet -- source/cet/nctc_passenger/init.lua; then
            echo 'Passenger choice navigation already materialized.'
            exit 0
          fi

          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'source/cet/nctc_passenger/init.lua'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/cet/nctc_passenger/init.lua
          git commit -m 'fix: navigate stop request with seat choices'
          git push origin HEAD:fix/native-stop-request-feature-v3
