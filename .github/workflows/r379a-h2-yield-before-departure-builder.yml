name: r379a H2 yield-before-departure builder

on:
  push:
    branches:
      - automation/r379a-h2-yield-before-departure-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch r376f yield gate and package r379a
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BRANCH="experiment/r379a-h2-yield-before-departure"
          BASE_SHA="411eadf5628fcbc4199feaa63fd0deaa122faf51"
          CLEAN="$RUNNER_TEMP/r379a-clean"
          rm -rf "$CLEAN"
          git fetch origin "$CLEAN_BRANCH"
          git worktree prune
          git worktree add -B "$CLEAN_BRANCH" "$CLEAN" "origin/$CLEAN_BRANCH"
          test "$(git -C "$CLEAN" rev-parse HEAD)" = "$BASE_SHA"

          ARRIVAL_BEFORE="$(git -C "$CLEAN" hash-object source/archive/pc/mod/NCTCH2Spline.archive)"
          DEPARTURE_BEFORE="$(git -C "$CLEAN" hash-object source/archive/pc/mod/NCTCH2Departure.archive)"
          DISPLAY_BEFORE="$(sha256sum "$CLEAN/source/archive/pc/mod/NCTCDisplayPrototype.archive" | awk '{print $1}')"

          python3 - "$CLEAN" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          transit = root / 'source/redscript/NCTC/NCTCTransitSystem.reds'
          s = transit.read_text()

          s = replace_once(
              s,
              'GameInstance.GetQuestsSystem(this.bus.GetGame()).SetFact(n"nctc_dev_build_revision", 37606);',
              'GameInstance.GetQuestsSystem(this.bus.GetGame()).SetFact(n"nctc_dev_build_revision", 37901);',
              'runtime revision')

          s = replace_once(
              s,
              '    // These must remain false for the service bus. Enabling either one lets\n    // the traffic controller snap the long Mahir to a neighboring lane when\n    // a route command starts or ends, which can eject standing passengers.\n    command.trafficTryNeighborsForStart = false;\n    command.trafficTryNeighborsForEnd = false;',
              '    // Keep neighbor snapping disabled for the service bus: on the long Mahir\n    // it can visibly teleport the vehicle sideways, which is not acceptable RP.\n    command.trafficTryNeighborsForStart = false;\n    command.trafficTryNeighborsForEnd = false;',
              'neighbor-snap comment')

          anchor = '''  public func DistanceToPlayer() -> Float {
    let player: ref<PlayerPuppet>;
    if !this.IsReady() { return 0.00; };
    player = GetPlayer(this.bus.GetGame());
    return IsDefined(player) ? Vector4.Distance(player.GetWorldPosition(), this.bus.GetWorldPosition()) : 0.00;
  }
'''
          addition = anchor + '''
  // r379a: vanilla TrafficSystem query used as a yield gate before an off-lane
  // bay departure. The query entity is the bus itself, so the engine excludes
  // it while returning nearby crowd-traffic entities inside this road corridor.
  public func CountTrafficVehiclesInDepartureCorridor(forward: Vector4, rearDistance: Float, corridorDepth: Float, corridorWidth: Float) -> Int32 {
    let traffic: ref<TrafficSystem>;
    let entities: array<wref<Entity>>;
    let queryBoxPoints: array<Vector4>;
    let direction: Vector4;
    let right: Vector4;
    let origin: Vector4;
    let vehicle: wref<VehicleObject>;
    let i: Int32 = 0;
    let vehicleCount: Int32 = 0;
    if !this.IsReady() { return 0; };
    direction = Vector4.Normalize2D(forward);
    if AbsF(direction.X) <= 0.01 && AbsF(direction.Y) <= 0.01 { return 0; };
    right = new Vector4(-direction.Y, direction.X, 0.00, 0.00);
    origin = this.bus.GetWorldPosition() - direction * MaxF(rearDistance, 0.00);
    traffic = GameInstance.GetTrafficSystem(this.bus.GetGame());
    if !IsDefined(traffic) { return 0; };
    ArrayPush(queryBoxPoints, origin + new Vector4(0.00, 0.00, -1.00, 0.00));
    ArrayPush(queryBoxPoints, origin + direction * MaxF(corridorDepth, 1.00) + new Vector4(0.00, 0.00, 3.00, 0.00));
    ArrayPush(queryBoxPoints, origin + right * MaxF(corridorWidth * 0.50, 1.00));
    ArrayPush(queryBoxPoints, origin - right * MaxF(corridorWidth * 0.50, 1.00));
    traffic.FindEntitiesNearPlane(this.bus, queryBoxPoints, origin, right, MaxF(corridorWidth * 0.50, 1.00), 32, entities);
    while i < ArraySize(entities) {
      vehicle = entities[i] as VehicleObject;
      if IsDefined(vehicle) && !Equals(vehicle.GetEntityID(), this.bus.GetEntityID()) {
        vehicleCount += 1;
      };
      i += 1;
    };
    return vehicleCount;
  }
'''
          s = replace_once(s, anchor, addition, 'traffic corridor method')

          old_departure = '''        if Equals(this.requestedStopId, 70) {
          this.bayParkingStage = 12;
          this.driveCommandSent = this.controller.DriveOnBaySpline("$/nctc/bays/h2/departure_spline", exitSpeed, false);
          this.PublishLoopDiagnostic(this.driveCommandSent ? 72 : 33, this.requestedStopId);
          this.ScheduleDispatch(0.10);
          return;
        };'''
          new_departure = '''        if Equals(this.requestedStopId, 70) {
          // r379a: do not launch the departure spline into live traffic. Hold the
          // bus in the bay until the native TrafficSystem corridor is clear.
          this.bayParkingStage = 14;
          this.driveCommandSent = true;
          quests.SetFact(n"nctc_dev_exit_traffic_count", 0);
          quests.SetFact(n"nctc_dev_exit_clear_polls", 0);
          this.PublishLoopDiagnostic(76, this.requestedStopId);
          this.ScheduleDispatch(0.10);
          return;
        };'''
          s = replace_once(s, old_departure, new_departure, 'H2 departure gate')

          old_telemetry = '''      if this.bayParkingActive && Equals(this.bayParkingStage, 10) {
        this.PublishLoopDiagnostic(71, this.requestedStopId);
      } else {
        if this.bayParkingActive && Equals(this.bayParkingStage, 12) {
          this.PublishLoopDiagnostic(73, this.requestedStopId);
        } else {
          this.PublishRouteCommandTelemetry();
        };
      };'''
          new_telemetry = '''      if this.bayParkingActive && Equals(this.bayParkingStage, 10) {
        this.PublishLoopDiagnostic(71, this.requestedStopId);
      } else {
        if this.bayParkingActive && Equals(this.bayParkingStage, 14) {
          this.PublishLoopDiagnostic(79, this.requestedStopId);
        } else {
          if this.bayParkingActive && Equals(this.bayParkingStage, 12) {
            this.PublishLoopDiagnostic(73, this.requestedStopId);
          } else {
            this.PublishRouteCommandTelemetry();
          };
        };
      };'''
          s = replace_once(s, old_telemetry, new_telemetry, 'yield telemetry')

          stage12 = '''    if this.bayParkingActive && Equals(this.bayParkingStage, 12) {
      if this.controller.IsSplineCommandSuccessful() {'''
          stage14 = '''    if this.bayParkingActive && Equals(this.bayParkingStage, 14) {
      let trafficCount: Int32 = this.controller.CountTrafficVehiclesInDepartureCorridor(this.GetBayForward(), 12.00, 80.00, 16.00);
      quests.SetFact(n"nctc_dev_exit_traffic_count", trafficCount);
      if trafficCount > 0 {
        this.bayParkingRetryCount = 0;
        quests.SetFact(n"nctc_dev_exit_clear_polls", 0);
        this.PublishLoopDiagnostic(77, this.requestedStopId);
        this.ScheduleDispatch(0.25);
        return;
      };
      this.bayParkingRetryCount += 1;
      quests.SetFact(n"nctc_dev_exit_clear_polls", this.bayParkingRetryCount);
      // Require a short stable gap rather than reacting to one empty frame.
      if this.bayParkingRetryCount < 3 {
        this.ScheduleDispatch(0.25);
        return;
      };
      this.bayParkingRetryCount = 0;
      this.bayParkingStage = 12;
      // Same validated r376f departure spline geometry. Only the manoeuvre pace
      // changes: low initial speed and braking to the spline end before handoff.
      this.driveCommandSent = this.controller.DriveOnBaySpline("$/nctc/bays/h2/departure_spline", 1.25, true);
      this.PublishLoopDiagnostic(this.driveCommandSent ? 78 : 33, this.requestedStopId);
      this.ScheduleDispatch(0.10);
      return;
    };

''' + stage12
          s = replace_once(s, stage12, stage14, 'stage14 yield gate')
          transit.write_text(s)

          cet = root / 'source/cet/nctc_survey/init.lua'
          c = cet.read_text()
          c = replace_once(
              c,
              '    [74] = "route loop: r376b H2 spline exit -> native traffic handoff",\n    [75] = "route loop: r376b H2 native departure spline FAILED"',
              '    [74] = "route loop: r376b H2 spline exit -> native traffic handoff",\n    [75] = "route loop: r376b H2 native departure spline FAILED",\n    [76] = "route loop: r379a H2 yield gate armed",\n    [77] = "route loop: r379a H2 yield: traffic vehicle present",\n    [78] = "route loop: r379a H2 clear gap -> slow departure spline armed",\n    [79] = "route loop: r379a H2 yield gate telemetry"',
              'CET states')
          c = replace_once(
              c,
              '  local command_extra = ""\n  if code == 29 or code == 31 or code == 32 or code == 41 or code == 46 then',
              '  local command_extra = ""\n  if code == 76 or code == 77 or code == 78 or code == 79 then\n    command_extra = " trafficVehicles=" .. tostring(fact(quests, "nctc_dev_exit_traffic_count"))\n      .. " clearPolls=" .. tostring(fact(quests, "nctc_dev_exit_clear_polls"))\n  end\n  if code == 29 or code == 31 or code == 32 or code == 41 or code == 46 then',
              'CET yield extras')
          c = replace_once(
              c,
              '  if revision == 37606 then\n    log("NCTC runtime build=37606 r376f H2 final nose clearance")',
              '  if revision == 37901 then\n    log("NCTC runtime build=37901 r379a H2 yield-before-departure POC")\n  elseif revision == 37606 then\n    log("NCTC runtime build=37606 r376f H2 final nose clearance")',
              'CET runtime')
          cet.write_text(c)
          PY

          # r379a must preserve the validated r376f geometry and display byte-for-byte.
          test "$(git -C "$CLEAN" hash-object source/archive/pc/mod/NCTCH2Spline.archive)" = "$ARRIVAL_BEFORE"
          test "$(git -C "$CLEAN" hash-object source/archive/pc/mod/NCTCH2Departure.archive)" = "$DEPARTURE_BEFORE"
          test "$(sha256sum "$CLEAN/source/archive/pc/mod/NCTCDisplayPrototype.archive" | awk '{print $1}')" = "$DISPLAY_BEFORE"
          grep -Fq 'CountTrafficVehiclesInDepartureCorridor' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"
          grep -Fq 'FindEntitiesNearPlane(this.bus' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"
          grep -Fq 'DriveOnBaySpline("$/nctc/bays/h2/departure_spline", 1.25, true)' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"
          grep -Fq 'nctc_dev_build_revision", 37901' "$CLEAN/source/redscript/NCTC/NCTCTransitSystem.reds"

          mapfile -t CHANGED < <(git -C "$CLEAN" diff --name-only)
          test "${#CHANGED[@]}" -eq 2
          printf '%s\n' "${CHANGED[@]}" | grep -Fxq 'source/redscript/NCTC/NCTCTransitSystem.reds'
          printf '%s\n' "${CHANGED[@]}" | grep -Fxq 'source/cet/nctc_survey/init.lua'

          git -C "$CLEAN" config user.name "github-actions[bot]"
          git -C "$CLEAN" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$CLEAN" add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git -C "$CLEAN" commit -m "test: r379a H2 yield before departure"
          CLEAN_SHA="$(git -C "$CLEAN" rev-parse HEAD)"
          git -C "$CLEAN" push origin "HEAD:refs/heads/$CLEAN_BRANCH"

          # Exactly one feature commit over r376f.
          test "$(git -C "$CLEAN" rev-list --count "$BASE_SHA..$CLEAN_SHA")" -eq 1
          test "$(git -C "$CLEAN" rev-list --count "$CLEAN_SHA..$BASE_SHA")" -eq 0

          ROOT="$RUNNER_TEMP/nctc-r379a"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/archive/pc/mod" "$ROOT/r6/scripts/NCTC" "$ROOT/r6/tweaks/NCTC"
          mkdir -p "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey"
          mkdir -p "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger"
          cp "$CLEAN"/source/archive/pc/mod/*.archive "$ROOT/archive/pc/mod/"
          cp "$CLEAN"/source/archive/pc/mod/*.archive.xl "$ROOT/archive/pc/mod/"
          cp "$CLEAN"/source/redscript/NCTC/*.reds "$ROOT/r6/scripts/NCTC/"
          cp "$CLEAN"/source/tweaks/NCTC/* "$ROOT/r6/tweaks/NCTC/"
          cp "$CLEAN/source/cet/nctc_survey/init.lua" "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp "$CLEAN/source/cet/nctc_survey/nctc_network.default.json" "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp "$CLEAN/source/cet/nctc_survey/nctc_survey_settings.json" "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp "$CLEAN"/source/cet/nctc_passenger/* "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger/"
          cp "$CLEAN/README.md" "$CLEAN/THIRD_PARTY_NOTICES.md" "$ROOT/"

          TRANSIT_BLOB="$(git -C "$CLEAN" hash-object source/redscript/NCTC/NCTCTransitSystem.reds)"
          CET_BLOB="$(git -C "$CLEAN" hash-object source/cet/nctc_survey/init.lua)"
          cat > "$ROOT/NCTC_BUILD_INFO.txt" <<EOF
          Night City Transit Corporation
          Devkit: r379a H2 yield-before-departure POC
          Runtime build: 37901
          Branch: $CLEAN_BRANCH
          Commit: $CLEAN_SHA
          Base: exact r376f $BASE_SHA
          Scope: H2 only. r376f arrival/departure spline archives and display are unchanged. Before departure, native TrafficSystem.FindEntitiesNearPlane scans an 80m x 16m road corridor (including 12m rearward) and counts VehicleObject traffic. The bus waits for three consecutive clear polls, then runs the original departure spline with low 1.25m/s initial speed and stopAtPathEnd=true. No JoinTraffic, no neighbor snapping, no lane teleport, no spline extension.
          Arrival archive blob: $ARRIVAL_BEFORE
          Departure archive blob: $DEPARTURE_BEFORE
          Display SHA256: $DISPLAY_BEFORE
          TRANSIT_BLOB=$TRANSIT_BLOB
          CET_BLOB=$CET_BLOB
          EOF

          test ! -e "$ROOT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/nctc_network.json"
          test "$(git hash-object "$ROOT/r6/scripts/NCTC/NCTCTransitSystem.reds")" = "$TRANSIT_BLOB"
          test "$(git hash-object "$ROOT/archive/pc/mod/NCTCH2Spline.archive")" = "$ARRIVAL_BEFORE"
          test "$(git hash-object "$ROOT/archive/pc/mod/NCTCH2Departure.archive")" = "$DEPARTURE_BEFORE"
          test "$(sha256sum "$ROOT/archive/pc/mod/NCTCDisplayPrototype.archive" | awk '{print $1}')" = "$DISPLAY_BEFORE"

          ZIP="$RUNNER_TEMP/NightCityTransitCorporation-0.3.0-devkit-r379a-h2-yield-before-departure-development.zip"
          rm -f "$ZIP" "$RUNNER_TEMP/r379a.sha256"
          pushd "$ROOT" >/dev/null
          zip -qr "$ZIP" .
          popd >/dev/null
          unzip -t "$ZIP"
          sha256sum "$ZIP" | tee "$RUNNER_TEMP/r379a.sha256"

          cat > "$RUNNER_TEMP/r379a-metadata.txt" <<EOF
          CLEAN_SHA=$CLEAN_SHA
          TRANSIT_BLOB=$TRANSIT_BLOB
          CET_BLOB=$CET_BLOB
          ARRIVAL_BLOB=$ARRIVAL_BEFORE
          DEPARTURE_BLOB=$DEPARTURE_BEFORE
          DISPLAY_SHA=$DISPLAY_BEFORE
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r379a-h2-yield-before-departure
          path: |
            ${{ runner.temp }}/NightCityTransitCorporation-0.3.0-devkit-r379a-h2-yield-before-departure-development.zip
            ${{ runner.temp }}/r379a.sha256
            ${{ runner.temp }}/r379a-metadata.txt
          compression-level: 0
