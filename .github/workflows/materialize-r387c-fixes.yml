name: materialize r387d seat restore only

on:
  push:
    branches:
      - fix/r387d-restore-r386e-seats
    paths:
      - .github/workflows/materialize-r387c-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore validated r386e seat logic only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('source/cet/nctc_passenger/init.lua')
          current = path.read_text(encoding='utf-8')
          base = subprocess.check_output([
              'git', 'show',
              'ac3810ad4d8eab8f9846a8ddfbfcf271c3b0973a:source/cet/nctc_passenger/init.lua'
          ], text=True)

          def block(text, start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          ui_start = '    Override("InteractionUIBase", "OnDialogsData", function(_, value, wrapped)\n'
          ui_end = '    Observe("PlayerPuppet", "OnAction", function(_, action, consumer)\n'
          current = current.replace(
              block(current, ui_start, ui_end),
              block(base, ui_start, ui_end),
              1,
          )

          action_start = '    Observe("PlayerPuppet", "OnAction", function(_, action, consumer)\n'
          action_end = '    print("[NCBN] Interior passenger-seat interaction initialized.")\n'
          old_action = block(current, action_start, action_end)
          seat_action = block(base, action_start, action_end)
          stop_action = '''    Observe("PlayerPuppet", "OnAction", function(_, action, consumer)\n        if action:GetName(action).value ~= "NCTC_RequestNextStop" then return end\n        if action:GetType(action).value ~= "BUTTON_PRESSED" or action:GetValue(action) <= 0 then return end\n        if getFact("nctc_player_in_service_bus") ~= 1 then return end\n        consumer:Consume()\n        if requestNextStop() then hideStopRequestHint() end\n    end)\n'''
          current = current.replace(old_action, stop_action + seat_action, 1)

          current_tail = '''    if #seats > 0 and not NCBN.choiceVisible then\n    NCBN.choiceVisible = true\n    showChoice()\nelseif #seats == 0 then\n    hideChoice()\nend\nif inside and getFact("nctc_display_stop_requested") == 0 then\n    showStopRequestHint()\nelse\n    hideStopRequestHint()\nend\nend)'''
          seat_tail = '''    if #seats > 0 and not NCBN.choiceVisible then\n        NCBN.choiceVisible = true\n        showChoice()\n    elseif #seats == 0 then hideChoice() end\n'''
          replacement_tail = seat_tail + '''    if inside and getFact("nctc_display_stop_requested") == 0 then\n        showStopRequestHint()\n    else\n        hideStopRequestHint()\n    end\nend)'''
          if current_tail not in current:
              raise SystemExit('expected r387c seat/hint tail not found')
          current = current.replace(current_tail, replacement_tail, 1)

          path.write_text(current, encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          if block(base, ui_start, ui_end) not in final:
              raise SystemExit('r386e InteractionUI seat hooks not restored exactly')
          if seat_action not in final:
              raise SystemExit('r386e seat/action observer not restored exactly')
          if seat_tail not in final:
              raise SystemExit('r386e seat state machine not restored exactly')
          if 'UpdateInputHintEvent.new()' not in final:
              raise SystemExit('native stop-request hint was lost')
          if 'NCTC_RequestNextStop' not in final:
              raise SystemExit('native stop-request action was lost')
          PY

          git diff --check
          git diff -- source/cet/nctc_passenger/init.lua

      - name: Commit passenger runtime only
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "source/cet/nctc_passenger/init.lua"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/cet/nctc_passenger/init.lua
          git commit -m "fix: restore validated r386e seat interaction unchanged"
          git push origin HEAD:fix/r387d-restore-r386e-seats
