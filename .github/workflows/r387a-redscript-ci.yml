name: r387a REDscript CI

on:
  push:
    branches:
      - feature/native-stop-request-input-v1
    paths:
      - .github/workflows/r387a-redscript-ci.yml
      - source/redscript/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redscript-compile:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compile NCTC with real REDscript compiler
        shell: pwsh
        run: ./tools/ci/redscript-compile.ps1

      - name: Upload REDscript CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redscript-ci-r387a-${{ github.run_id }}
          path: ${{ env.NCTC_REDSCRIPT_CI_LOG }}
          if-no-files-found: ignore
          retention-days: 14
