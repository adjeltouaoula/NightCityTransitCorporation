name: r375a finalize builder

on:
  push:
    branches:
      - automation/r375a-finalize-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply r375a finalizer
        run: |
          python3 tools/r375a_finalize.py
          grep -q 'this.bayParkingActive = false;' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q '\[67\] = "route loop: r375a exit retry"' source/cet/nctc_survey/init.lua
          git diff --check
      - name: Commit source
        run: |
          git config user.name 'NCTC build bot'
          git config user.email 'nctc-build-bot@users.noreply.github.com'
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m 'fix: finalize r375a bay reset state'
          git push
