name: r378a native JoinTraffic handoff builder

on:
  push:
    branches:
      - automation/r378a-native-join-traffic-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build r378a
        shell: bash
        run: bash tools/r378a/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r378a-h2-native-join-traffic-handoff
          path: |
            ${{ runner.temp }}/NightCityTransitCorporation-0.3.0-devkit-r378a-h2-native-join-traffic-handoff-development.zip
            ${{ runner.temp }}/r378a.sha256
            ${{ runner.temp }}/r378a-metadata.txt
          compression-level: 0
