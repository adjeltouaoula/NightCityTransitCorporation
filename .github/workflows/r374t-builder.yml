name: r374t builder

on:
  push:
    branches:
      - automation/r374t-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply r374t patch
        run: python3 tools/r374t_patch.py
      - name: Commit source
        run: |
          git config user.name "NCTC build bot"
          git config user.email "nctc-build-bot@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m "feat: r374t real-bus S-curve bay path"
          git push origin HEAD:automation/r374t-builder
# retry current script
