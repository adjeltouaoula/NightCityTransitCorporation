name: materialize r387a native stop input

on:
  push:
    branches:
      - feature/native-stop-request-input-v1
    paths:
      - .github/workflows/materialize-r387a-native-stop-input.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace CET hotkey with native action and in-bus hint
        shell: python
        run: |
          from pathlib import Path

          p = Path('source/cet/nctc_passenger/init.lua')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '    hubChoiceRevision = -1, lastInsideLocal = nil }',
              '    hubChoiceRevision = -1, lastInsideLocal = nil, stopRequestVisible = false, stopRequestHub = nil }',
              1,
          )

          old_hotkey = '''registerInput("nctc_request_next_stop", "NCTC — Request next stop", function(keypress)\n    if not keypress then return end\n    requestNextStop()\nend)\n\n'''
          if old_hotkey not in s:
              raise SystemExit('legacy CET stop-request input block not found')
          s = s.replace(old_hotkey, '', 1)

          marker = 'local function hideChoice()\n'
          if marker not in s:
              raise SystemExit('hideChoice marker not found')
          insert = '''local function makeStopRequestHub()\n    local hub = gameinteractionsvisListChoiceHubData.new()\n    hub.title, hub.activityState, hub.hubPriority, hub.id = "NCTC", gameinteractionsvisEVisualizerActivityState.Active, 1, 77903\n    local choiceType = gameinteractionsChoiceTypeWrapper.new()\n    choiceType:SetType(gameinteractionsChoiceType.Selected)\n    local choice = gameinteractionsvisListChoiceData.new()\n    choice.localizedName = "Demander le prochain arrêt"\n    -- The vanilla interaction HUD resolves this action name back to the\n    -- current Input Loader / Mod Settings binding, so the displayed glyph\n    -- follows keyboard/gamepad rebinding automatically.\n    choice.inputActionName = CName.new("NCTC_RequestNextStop")\n    choice.type = choiceType\n    hub.choices = { choice }\n    return hub\nend\n\nlocal function hideStopRequestHint()\n    if not NCBN.stopRequestVisible then return end\n    NCBN.stopRequestVisible, NCBN.stopRequestHub = false, nil\n    if NCBN.interactionUI then\n        local defs = GetAllBlackboardDefs().UIInteractions\n        local blackboard = Game.GetBlackboardSystem():Get(defs)\n        if blackboard:GetInt(defs.ActiveChoiceHubID) == 77903 then blackboard:SetInt(defs.ActiveChoiceHubID, 0) end\n        NCBN.interactionUI:OnDialogsData(blackboard:GetVariant(defs.DialogChoiceHubs))\n        NCBN.interactionUI:OnInteractionsChanged()\n        NCBN.interactionUI:UpdateListBlackboard()\n    end\nend\n\nlocal function showStopRequestHint()\n    if NCBN.stopRequestVisible then return end\n    if not NCBN.interactionUI or NCBN.choiceVisible or NCBN.hubChoiceVisible then return end\n    if getFact("nctc_player_in_service_bus") ~= 1 or getFact("nctc_display_stop_requested") == 1 then return end\n    NCBN.stopRequestHub = makeStopRequestHub()\n    NCBN.stopRequestVisible = true\n    local defs = GetAllBlackboardDefs().UIInteractions\n    local blackboard = Game.GetBlackboardSystem():Get(defs)\n    blackboard:SetInt(defs.ActiveChoiceHubID, NCBN.stopRequestHub.id)\n    NCBN.interactionUI:OnDialogsSelectIndex(0)\n    NCBN.interactionUI:OnDialogsData(blackboard:GetVariant(defs.DialogChoiceHubs))\n    NCBN.interactionUI:OnInteractionsChanged()\n    NCBN.interactionUI:UpdateListBlackboard()\n    NCBN.interactionUI:OnDialogsActivateHub(NCBN.stopRequestHub.id)\nend\n\n'''
          s = s.replace(marker, insert + marker, 1)

          old_dialog = '''        if (NCBN.choiceVisible and NCBN.choiceHub) or (NCBN.hubChoiceVisible and NCBN.hubChoiceHub) then\n'''
          new_dialog = '''        if (NCBN.choiceVisible and NCBN.choiceHub) or (NCBN.hubChoiceVisible and NCBN.hubChoiceHub) or (NCBN.stopRequestVisible and NCBN.stopRequestHub) then\n'''
          if old_dialog not in s:
              raise SystemExit('OnDialogsData condition not found')
          s = s.replace(old_dialog, new_dialog, 1)

          old_insert = '''            if NCBN.choiceVisible and NCBN.choiceHub then table.insert(hubs, NCBN.choiceHub) end\n            if NCBN.hubChoiceVisible and NCBN.hubChoiceHub then table.insert(hubs, NCBN.hubChoiceHub) end\n'''
          new_insert = old_insert + '''            if NCBN.stopRequestVisible and NCBN.stopRequestHub then table.insert(hubs, NCBN.stopRequestHub) end\n'''
          if old_insert not in s:
              raise SystemExit('hub insertion block not found')
          s = s.replace(old_insert, new_insert, 1)

          old_select = '''    Override("InteractionUIBase", "OnDialogsSelectIndex", function(_, index, wrapped)\n        if NCBN.hubChoiceVisible then return wrapped(NCBN.selectedHubLine) end\n        wrapped(NCBN.choiceVisible and NCBN.selectedSeat or index)\n    end)\n'''
          new_select = '''    Override("InteractionUIBase", "OnDialogsSelectIndex", function(_, index, wrapped)\n        if NCBN.hubChoiceVisible then return wrapped(NCBN.selectedHubLine) end\n        if NCBN.choiceVisible then return wrapped(NCBN.selectedSeat) end\n        if NCBN.stopRequestVisible then return wrapped(0) end\n        wrapped(index)\n    end)\n'''
          if old_select not in s:
              raise SystemExit('OnDialogsSelectIndex block not found')
          s = s.replace(old_select, new_select, 1)

          old_activate = '''    Override("dialogWidgetGameController", "OnDialogsActivateHub", function(_, id, wrapped)\n        if NCBN.hubChoiceVisible and NCBN.hubChoiceHub then return wrapped(NCBN.hubChoiceHub.id) end\n        return wrapped(NCBN.choiceVisible and NCBN.choiceHub and NCBN.choiceHub.id or id)\n    end)\n'''
          new_activate = '''    Override("dialogWidgetGameController", "OnDialogsActivateHub", function(_, id, wrapped)\n        if NCBN.hubChoiceVisible and NCBN.hubChoiceHub then return wrapped(NCBN.hubChoiceHub.id) end\n        if NCBN.choiceVisible and NCBN.choiceHub then return wrapped(NCBN.choiceHub.id) end\n        if NCBN.stopRequestVisible and NCBN.stopRequestHub then return wrapped(NCBN.stopRequestHub.id) end\n        return wrapped(id)\n    end)\n'''
          if old_activate not in s:
              raise SystemExit('OnDialogsActivateHub block not found')
          s = s.replace(old_activate, new_activate, 1)

          old_action = '''    Observe("PlayerPuppet", "OnAction", function(_, action, consumer)\n        if NCBN.inputLocked or action:GetType(action).value ~= "BUTTON_PRESSED" or action:GetValue(action) <= 0 then return end\n        local name = action:GetName(action).value\n'''
          new_action = '''    Observe("PlayerPuppet", "OnAction", function(_, action, consumer)\n        local actionType = action:GetType(action).value\n        local name = action:GetName(action).value\n        -- Native Input Loader action. Priority -99 makes it reach NCTC before\n        -- the vanilla D-pad-down phone/notification mappings. Consuming the\n        -- physical input here keeps those vanilla actions untouched outside\n        -- the NCTC cabin but prevents the same press leaking through inside.\n        if name == "NCTC_RequestNextStop" and actionType == "BUTTON_PRESSED" and action:GetValue(action) > 0\n            and getFact("nctc_player_in_service_bus") == 1 then\n            NCBN.inputLocked = true\n            consumer:Consume()\n            if requestNextStop() then hideStopRequestHint() end\n            return\n        end\n        if NCBN.inputLocked or actionType ~= "BUTTON_PRESSED" or action:GetValue(action) <= 0 then return end\n'''
          if old_action not in s:
              raise SystemExit('PlayerPuppet OnAction prefix not found')
          s = s.replace(old_action, new_action, 1)

          old_no_bus = '''        signalTransitSystem(false)\n        hideChoice()\n        return\n'''
          new_no_bus = '''        signalTransitSystem(false)\n        hideStopRequestHint()\n        hideChoice()\n        return\n'''
          if old_no_bus not in s:
              raise SystemExit('no-bus cleanup block not found')
          s = s.replace(old_no_bus, new_no_bus, 1)

          old_mounted = '''        hideChoice()\n        return\n    end\n    -- Mounting is asynchronous. Do not clear the provenance on the frame\n'''
          new_mounted = '''        hideChoice()\n        if aboard and getFact("nctc_display_stop_requested") == 0 then showStopRequestHint() else hideStopRequestHint() end\n        return\n    end\n    -- Mounting is asynchronous. Do not clear the provenance on the frame\n'''
          if old_mounted not in s:
              raise SystemExit('mounted return block not found')
          s = s.replace(old_mounted, new_mounted, 1)

          old_bottom = '''    if #seats > 0 and not NCBN.choiceVisible then\n        NCBN.choiceVisible = true\n        showChoice()\n    elseif #seats == 0 then hideChoice() end\nend)\n'''
          new_bottom = '''    if #seats > 0 and not NCBN.choiceVisible then\n        hideStopRequestHint()\n        NCBN.choiceVisible = true\n        showChoice()\n    elseif #seats == 0 then\n        hideChoice()\n        if inside and getFact("nctc_display_stop_requested") == 0 then showStopRequestHint() else hideStopRequestHint() end\n    else\n        hideStopRequestHint()\n    end\nend)\n'''
          if old_bottom not in s:
              raise SystemExit('onUpdate seat tail not found')
          s = s.replace(old_bottom, new_bottom, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify native stop-request source
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'registerInput("nctc_request_next_stop"' source/cet/nctc_passenger/init.lua
          grep -q 'name == "NCTC_RequestNextStop"' source/cet/nctc_passenger/init.lua
          grep -q 'consumer:Consume()' source/cet/nctc_passenger/init.lua
          grep -q 'Demander le prochain arrêt' source/cet/nctc_passenger/init.lua
          grep -q 'inputActionName = CName.new("NCTC_RequestNextStop")' source/cet/nctc_passenger/init.lua
          grep -q 'IK_Pad_DigitDown' source/input/nctc_stop_request.xml
          grep -q 'IK_U' source/input/nctc_stop_request.xml
          grep -q 'priority="-99"' source/input/nctc_stop_request.xml
          grep -q 'NCTC_RequestNextStop_Gamepad' source/redscript/NCTC/NCTCStopRequestSettings.reds
          git diff --check

      - name: Commit materialized input UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/cet/nctc_passenger/init.lua
          git commit -m 'feat: native stop-request action and in-bus hint'
          git push origin HEAD:feature/native-stop-request-input-v1
