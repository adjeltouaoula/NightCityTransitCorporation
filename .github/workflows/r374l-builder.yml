name: r374l-builder

on:
  push:
    branches:
      - automation/r374l-builder

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply r374l rolling bay handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          transit = Path('source/redscript/NCTC/NCTCTransitSystem.reds')
          s = transit.read_text()

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          s = replace_one(s, 'SetFact(n"nctc_dev_build_revision", 37411);', 'SetFact(n"nctc_dev_build_revision", 37412);', 'build revision')
          s = replace_one(s, 'if berthEntryLongitudinal > 8.00 {', 'if berthEntryLongitudinal > 12.00 {', 'stage-1 threshold')

          stage_start = s.index('    // Stage 1: once the nose has entered, aim beyond the berth and let the')
          stage_end = s.index('    // r374i: keep the stage-2 corridor command alive through arrival.', stage_start)
          new_stage = '\n'.join([
              '    // r374l rolling bay handoff. Do NOT let the first direct command arrive at',
              '    // its virtual ENTRY target: DriveToPoint brakes for that point and caused',
              '    // the visible hesitation before ALIGN. While the Mahir is still rolling,',
              '    // replace it about 12 m before the real berth with the final corridor',
              '    // target. The first target therefore shapes the early nose-in arc only.',
              '    if this.berthManeuverActive && Equals(this.berthManeuverStage, 1) {',
              '      let rollingAlignLateral: Float;',
              '      let rollingAlignLongitudinal: Float = this.GetBerthProgress(rollingAlignLateral);',
              '      if rollingAlignLongitudinal <= 12.00 {',
              '        this.berthManeuverStage = 2;',
              '        this.legPolls = 0;',
              '        this.driveCommandSent = this.controller.DriveToBerthDirect(this.GetBerthCorridorTarget(), AbsF(this.controller.GetCurrentSpeed()));',
              '        this.PublishLoopDiagnostic(this.driveCommandSent ? 44 : 33, this.requestedStopId);',
              '        this.ScheduleDispatch(0.05);',
              '        return;',
              '      };',
              '    };',
              '',
          ])
          s = s[:stage_start] + new_stage + s[stage_end:]
          transit.write_text(s)

          logger = Path('source/cet/nctc_survey/init.lua')
          t = logger.read_text()
          replacements = [
              ('[43] = "route loop: r374k continuous early-nose ENTRY command sent",', '[43] = "route loop: r374l rolling early-nose ENTRY command sent",'),
              ('[44] = "route loop: r374k late ALIGN corridor command sent",', '[44] = "route loop: r374l rolling ALIGN handoff sent",'),
              ('[45] = "route loop: legacy final BERTH command sent (unexpected in r374k)",', '[45] = "route loop: legacy final BERTH command sent (unexpected in r374l)",'),
              ('[48] = "route loop: r374k strong immediate departure ARC sent",', '[48] = "route loop: r374l strong immediate departure ARC sent",'),
              ('[49] = "route loop: r374k late rolling departure handoff to traffic"', '[49] = "route loop: r374l late rolling departure handoff to traffic"'),
          ]
          for old, new in replacements:
              t = replace_one(t, old, new, 'logger label')
          old_build = '  if revision == 37411 then\n    log("NCTC runtime build=37411 r374k late align + stronger departure arc")\n'
          new_build = '  if revision == 37412 then\n    log("NCTC runtime build=37412 r374l rolling bay handoff, no entry hesitation")\n  elseif revision == 37411 then\n    log("NCTC runtime build=37411 r374k late align + stronger departure arc")\n'
          t = replace_one(t, old_build, new_build, 'logger build marker')
          logger.write_text(t)
          PY

      - name: Validate patch
        run: |
          grep -q 'nctc_dev_build_revision", 37412' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'rollingAlignLongitudinal <= 12.00' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'runtime build=37412 r374l rolling bay handoff' source/cet/nctc_survey/init.lua
          ! grep -q 'IsNear(this.GetBerthEntryTarget(), 2.50)' source/redscript/NCTC/NCTCTransitSystem.reds

      - name: Commit feature and remove temporary workflow
        run: |
          git config user.name 'NCTC build bot'
          git config user.email 'nctc-build-bot@users.noreply.github.com'
          git rm .github/workflows/r374l-builder.yml
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m 'feat: r374l rolling bay handoff'
          git push origin HEAD:automation/r374l-builder
