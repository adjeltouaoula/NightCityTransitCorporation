name: r374v width-aware builder
on:
  push:
    branches: ["automation/r374v-width-aware-builder"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply r374v patch
        run: python3 tools/r374v_patch.py
      - name: Commit source
        run: |
          set -e
          git config user.name "NCTC build bot"
          git config user.email "nctc-build-bot@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git diff --cached --check
          git commit -m "fix: r374v calibrated narrow-bay geometry"
          git push origin HEAD:automation/r374v-width-aware-builder
