name: retarget called-stop builder

on:
  push:
    branches:
      - feature/called-stop-service-v1
    paths:
      - .github/workflows/retarget-called-stop-builder.yml

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retarget generic package builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/generic-bay-builder.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('name: generic bay v1 builder','name: called stop service v1 builder',1)
          s=s.replace('      - integration/generic-bays-v1\n','      - integration/generic-bays-v1\n      - feature/called-stop-service-v1\n',1)
          s=s.replace('nctc_dev_build_revision\", 38401','nctc_dev_build_revision\", 38501')
          s=s.replace('NightCityTransitCorporation-0.3.0-devkit-r384a-generic-bays-v1.zip','NightCityTransitCorporation-0.3.0-devkit-r385a-called-stop-service-v1.zip')
          s=s.replace('nctc-r384a-generic-bays-v1-package','nctc-r385a-called-stop-service-v1-package')
          if 'feature/called-stop-service-v1' not in s or '38501' not in s or 'r385a-called-stop-service-v1' not in s:
              raise SystemExit('builder retarget failed')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          rm .github/workflows/retarget-called-stop-builder.yml
          git diff --check
      - name: Commit builder retarget
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: package called-stop service v1"
          git push origin HEAD:feature/called-stop-service-v1
