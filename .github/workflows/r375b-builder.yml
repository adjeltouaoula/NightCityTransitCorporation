name: r375b builder
on:
  push:
    branches:
      - automation/r375b-builder
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/r375b-builder
      - name: Apply r375b patch
        run: python tools/r375b_patch.py
      - name: Commit source
        run: |
          git config user.name "NCTC build bot"
          git config user.email "nctc-build-bot@users.noreply.github.com"
          git add source/redscript/NCTC/NCTCTransitSystem.reds source/cet/nctc_survey/init.lua
          git commit -m "fix: r375b early-progress bay parking"
          git push
