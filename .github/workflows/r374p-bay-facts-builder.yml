name: r374p-bay-facts-builder
on:
  push:
    branches: ["automation/r374p-bay-facts-builder"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fresh berth2 validity and bay diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('source/cet/nctc_survey/init.lua')
          s = p.read_text()
          old = '''    set_fact(quests, prefix .. "spawn_valid", 0)\n    set_fact(quests, prefix .. "approach_valid", 0)\n    set_fact(quests, prefix .. "berth_valid", 0)\n'''
          new = '''    set_fact(quests, prefix .. "spawn_valid", 0)\n    set_fact(quests, prefix .. "approach_valid", 0)\n    set_fact(quests, prefix .. "berth_valid", 0)\n    set_fact(quests, prefix .. "berth2_valid", 0)\n    set_fact(quests, prefix .. "berth2_forward_valid", 0)\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  if revision == 37415 then\n    log("NCTC runtime build=37415 r374o two-point bay geometry + authored exit handoff")\n  elseif revision == 37414 then'''
          new = '''  if revision == 37416 then\n    log("NCTC runtime build=37416 r374p fresh bay facts + geometry diagnostics")\n  elseif revision == 37415 then\n    log("NCTC runtime build=37415 r374o two-point bay geometry + authored exit handoff")\n  elseif revision == 37414 then'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''  local mount_request = fact(quests, "nctc_dev_loop_mount_request")\n'''
          add = marker + '''  local has_bay = fact(quests, "nctc_dev_loop_has_bay")\n  local bay_length = fact(quests, "nctc_dev_loop_bay_length_mm") / 1000.0\n  local bay_p1_x = fact(quests, "nctc_dev_loop_bay_p1_x_mm") / 1000.0\n  local bay_p1_y = fact(quests, "nctc_dev_loop_bay_p1_y_mm") / 1000.0\n  local bay_p2_x = fact(quests, "nctc_dev_loop_bay_p2_x_mm") / 1000.0\n  local bay_p2_y = fact(quests, "nctc_dev_loop_bay_p2_y_mm") / 1000.0\n'''
          assert marker in s
          s = s.replace(marker, add, 1)

          s = s.replace('[43] = "route loop: r374m single continuous BAY command sent",', '[43] = "route loop: r374o two-point BAY direct command sent",', 1)
          s = s.replace('[48] = "route loop: legacy departure ARC sent (unexpected in r374m)",', '[48] = "route loop: r374o authored bay exit command sent",', 1)
          s = s.replace('[49] = "route loop: r374m native lane recovery departure",', '[49] = "route loop: r374o traffic handoff after bay exit / road stop",', 1)

          marker = '''  if berth_active == 1 or code == 43 or code == 44 or code == 45 then\n'''
          diag = '''  if code == 29 or code == 30 or code == 36 or code == 43 or code == 47 or code == 48 or code == 49 or code == 50 then\n    command_extra = command_extra\n      .. " hasBay=" .. tostring(has_bay)\n      .. " bayLen=" .. string.format("%.2fm", bay_length)\n      .. string.format(" P1=(%.3f, %.3f) P2=(%.3f, %.3f)", bay_p1_x, bay_p1_y, bay_p2_x, bay_p2_y)\n  end\n'''
          assert marker in s
          s = s.replace(marker, diag + marker, 1)
          p.write_text(s)

          p = Path('source/redscript/NCTC/NCTCTransitSystem.reds')
          s = p.read_text()
          assert 'SetFact(n"nctc_dev_build_revision", 37415);' in s
          s = s.replace('SetFact(n"nctc_dev_build_revision", 37415);', 'SetFact(n"nctc_dev_build_revision", 37416);', 1)

          marker = '''    quests.SetFact(n"nctc_dev_loop_mount_request", quests.GetFact(n"nctc_passenger_departure_requested"));\n'''
          add = marker + '''    quests.SetFact(n"nctc_dev_loop_has_bay", this.HasServiceBay() ? 1 : 0);\n    quests.SetFact(n"nctc_dev_loop_bay_p1_x_mm", Cast<Int32>(this.surveyBerth.X * 1000.00));\n    quests.SetFact(n"nctc_dev_loop_bay_p1_y_mm", Cast<Int32>(this.surveyBerth.Y * 1000.00));\n    quests.SetFact(n"nctc_dev_loop_bay_p2_x_mm", Cast<Int32>(this.surveyBerth2.X * 1000.00));\n    quests.SetFact(n"nctc_dev_loop_bay_p2_y_mm", Cast<Int32>(this.surveyBerth2.Y * 1000.00));\n    quests.SetFact(n"nctc_dev_loop_bay_length_mm", this.HasServiceBay() ? Cast<Int32>(Vector4.Distance(this.surveyBerth, this.surveyBerth2) * 1000.00) : 0);\n'''
          assert marker in s
          s = s.replace(marker, add, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -q 'berth2_valid", 0' source/cet/nctc_survey/init.lua
          grep -q 'nctc_dev_loop_has_bay' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'nctc_dev_build_revision", 37416' source/redscript/NCTC/NCTCTransitSystem.reds
      - name: Commit clean feature tree
        shell: bash
        run: |
          rm -f .github/workflows/r374p-bay-facts-builder.yml
          git config user.name 'NCTC build bot'
          git config user.email 'nctc-build-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix: r374p publish fresh two-point bay geometry'
          git push origin HEAD:automation/r374p-bay-facts-builder
      - name: Package devkit
        shell: bash
        run: |
          set -euo pipefail
          OUT=package
          rm -rf "$OUT"
          mkdir -p "$OUT/r6/scripts/NCTC" "$OUT/r6/tweaks/NCTC" \
                   "$OUT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey" \
                   "$OUT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger" \
                   "$OUT/archive/pc/mod"
          cp source/redscript/NCTC/*.reds "$OUT/r6/scripts/NCTC/"
          cp source/tweaks/NCTC/* "$OUT/r6/tweaks/NCTC/"
          cp source/cet/nctc_survey/* "$OUT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp source/cet/nctc_passenger/* "$OUT/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger/"
          cp source/archive/pc/mod/NCTCDisplayPrototype.archive "$OUT/archive/pc/mod/"
          cp source/archive/pc/mod/NCTCTrafficRuntime.archive "$OUT/archive/pc/mod/"
          cp README.md THIRD_PARTY_NOTICES.md "$OUT/"
          cat > "$OUT/NCTC_BUILD_INFO.txt" <<'EOF'
          Night City Transit Corporation devkit
          Build: r374p fresh bay facts diagnostics
          Runtime: 37416
          Base: r374o two-point bay geometry

          FIXES
          - Clears berth2_valid/forward_valid before every external network republish so deleted or stale Point 2 facts cannot survive.
          - Logs hasBay, Point 1, Point 2 and bay length on route-loop diagnostics.
          - Driving geometry is otherwise unchanged from r374o.

          NOTE
          nctc_network.json remains persistent user-authored runtime data and is intentionally not overwritten by this package.
          EOF
          ZIP=NightCityTransitCorporation-0.3.0-devkit-r374p-fresh-bay-facts-development.zip
          (cd "$OUT" && zip -qr "../$ZIP" .)
          unzip -tq "$ZIP"
          sha256sum "$ZIP" | tee "$ZIP.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: r374p-devkit
          path: |
            NightCityTransitCorporation-0.3.0-devkit-r374p-fresh-bay-facts-development.zip
            NightCityTransitCorporation-0.3.0-devkit-r374p-fresh-bay-facts-development.zip.sha256
          if-no-files-found: error
