name: r388f restore r383f occupied-bay fallback

on:
  push:
    branches:
      - fix/occupied-bay-bypass-r383f-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: patch
        name: Restore validated occupied-bay traffic fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/redscript/NCTC/NCTCTransitSystem.reds')
          s = p.read_text(encoding='utf-8')

          old = '''  if this.HasServiceBay() {\n    forward = this.GetBayForward();'''
          new = '''  if this.HasServiceBay() && !this.bayParkingBypass {\n    forward = this.GetBayForward();'''
          if old in s:
              assert s.count(old) == 1
              s = s.replace(old, new, 1)
          else:
              assert new in s

          old = '''          this.bayParkingWasEntered = false;\n          this.PublishLoopDiagnostic(96, this.requestedStopId);\n        };'''
          new = '''          this.bayParkingWasEntered = false;\n          this.controller.CancelTrafficRoute();\n          this.driveCommandSent = this.controller.DriveToTraffic(this.GetTrafficTarget(), 0.00);\n          this.PublishLoopDiagnostic(this.driveCommandSent ? 96 : 33, this.requestedStopId);\n          this.ScheduleDispatch(0.25);\n          return;\n        };'''
          if old in s:
              assert s.count(old) == 1
              s = s.replace(old, new, 1)
          else:
              assert new in s

          old = '''            this.bayParkingWasEntered = false;\n            this.PublishLoopDiagnostic(96, this.requestedStopId);\n            this.ScheduleDispatch(0.10);\n            return;'''
          new = '''            this.bayParkingWasEntered = false;\n            this.controller.CancelTrafficRoute();\n            this.driveCommandSent = this.controller.DriveToTraffic(this.GetTrafficTarget(), 0.00);\n            this.PublishLoopDiagnostic(this.driveCommandSent ? 96 : 33, this.requestedStopId);\n            this.ScheduleDispatch(0.10);\n            return;'''
          if old in s:
              assert s.count(old) == 1
              s = s.replace(old, new, 1)
          else:
              assert new in s

          assert 'roadBerth' not in s
          assert 'if this.HasServiceBay() && !this.bayParkingBypass {' in s
          p.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet -- source/redscript/NCTC/NCTCTransitSystem.reds; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'source/redscript/NCTC/NCTCTransitSystem.reds'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/redscript/NCTC/NCTCTransitSystem.reds
          git commit -m 'fix: restore r383f occupied-bay traffic fallback'
          git push origin HEAD:fix/occupied-bay-bypass-r383f-v3
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  redscript-compile:
    needs: prepare
    if: needs.prepare.outputs.changed == 'false'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compile NCTC with real REDscript compiler
        shell: pwsh
        run: ./tools/ci/redscript-compile.ps1
      - name: Upload REDscript CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r388f-redscript-ci-log-${{ github.run_id }}
          path: ${{ env.NCTC_REDSCRIPT_CI_LOG }}
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: prepare
    if: needs.prepare.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact runtime scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 1
          test "$(git diff --name-only HEAD^ HEAD)" = 'source/redscript/NCTC/NCTCTransitSystem.reds'
          grep -q 'if this.HasServiceBay() && !this.bayParkingBypass {' source/redscript/NCTC/NCTCTransitSystem.reds
          ! grep -q 'roadBerth' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'this.bayParkingBypass ? 12.00 : 7.00' source/redscript/NCTC/NCTCTransitSystem.reds
          grep -q 'NCTC_RequestNextStop' source/cet/nctc_stop_request/init.lua
          ! grep -q 'registerInput(' source/cet/nctc_stop_request/init.lua
          ! grep -q 'NCTC_RequestNextStop' source/cet/nctc_passenger/init.lua
          grep -q 'ModSettings.mod' source/redscript/NCTC/NCTCStopRequestSettings.reds
          grep -q 'new HDRColor(1.00, 0.55, 0.10, 1.00)' source/redscript/NCTC/NCTCBusDisplay.reds

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install WolvenKit CLI 9.0.1
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r388f"
          mkdir -p "$WORK/tools"
          dotnet tool install WolvenKit.CLI --version 9.0.1 --tool-path "$WORK/tools"

      - name: Generate authored bay assets
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r388f"
          TOOL="$WORK/tools/cp77tools"
          RAW="$WORK/template-raw"
          TEMPLATE="$WORK/template-json"
          GENERATED="$WORK/generated"
          OUT="$WORK/out"
          MANIFEST="$WORK/bays.json"
          mkdir -p "$RAW" "$TEMPLATE" "$GENERATED" "$OUT"
          python3 tools/bays/extract_bays_from_network.py --network source/cet/nctc_survey/nctc_network.default.json --out "$MANIFEST"
          "$TOOL" unbundle tools/bays/template/validated_arrival_template.archive -o "$RAW"
          SECTOR="$(find "$RAW" -type f -name 'h2_arrival.streamingsector' | head -n1)"
          BLOCK="$(find "$RAW" -type f -name 'all.streamingblock' | head -n1)"
          "$TOOL" convert serialize "$SECTOR" -o "$TEMPLATE"
          "$TOOL" convert serialize "$BLOCK" -o "$TEMPLATE"
          SECTOR_JSON="$(find "$TEMPLATE" -type f -name 'h2_arrival.streamingsector.json' | head -n1)"
          BLOCK_JSON="$(find "$TEMPLATE" -type f -name 'all.streamingblock.json' | head -n1)"
          python3 tools/bays/generate_arrival_splines.py --sector-template "$SECTOR_JSON" --block-template "$BLOCK_JSON" --manifest "$MANIFEST" --out "$GENERATED"
          mapfile -t STOPS < <(python3 - "$MANIFEST" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          for bay in data['bays']:
              print(int(bay['stopId']))
          PY
          )
          for STOP in "${STOPS[@]}"; do
            D="$GENERATED/stop_${STOP}"
            "$TOOL" convert deserialize "$D/arrival.streamingsector.json"
            "$TOOL" convert deserialize "$D/all.streamingblock.json"
            PACKROOT="$WORK/NCTCBay${STOP}Spline"
            mkdir -p "$PACKROOT/nctc/bays/stop_${STOP}/sectors"
            cp "$D/arrival.streamingsector" "$PACKROOT/nctc/bays/stop_${STOP}/sectors/arrival.streamingsector"
            cp "$D/all.streamingblock" "$PACKROOT/nctc/bays/stop_${STOP}/all.streamingblock"
            "$TOOL" pack "$PACKROOT" -o "$OUT"
            cat > "$OUT/NCTCBay${STOP}Spline.archive.xl" <<EOF
          streaming:
            blocks:
              - nctc\\bays\\stop_${STOP}\\all.streamingblock
          EOF
          done

      - name: Assemble exact branch package
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/r388f"
          OUT="$WORK/out"
          PKG="$WORK/package"
          mkdir -p "$PKG/archive/pc/mod" "$PKG/r6/scripts/NCTC" "$PKG/r6/tweaks/NCTC" "$PKG/r6/input" "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger" "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_stop_request" "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey"
          cp source/archive/pc/mod/* "$PKG/archive/pc/mod/"
          cp "$OUT"/*.archive "$PKG/archive/pc/mod/"
          cp "$OUT"/*.archive.xl "$PKG/archive/pc/mod/"
          cp source/redscript/NCTC/*.reds "$PKG/r6/scripts/NCTC/"
          cp source/tweaks/NCTC/* "$PKG/r6/tweaks/NCTC/"
          cp source/input/nctc_stop_request.xml "$PKG/r6/input/"
          cp source/cet/nctc_passenger/* "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger/"
          cp source/cet/nctc_stop_request/* "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_stop_request/"
          cp source/cet/nctc_survey/* "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          test ! -e "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/nctc_network.json"
          (cd "$PKG" && zip -qr "$WORK/NightCityTransitCorporation-0.3.0-devkit-r388f-r383f-bypass.zip" .)
          unzip -t "$WORK/NightCityTransitCorporation-0.3.0-devkit-r388f-r383f-bypass.zip"
          sha256sum "$WORK/NightCityTransitCorporation-0.3.0-devkit-r388f-r383f-bypass.zip" | tee "$WORK/PACKAGE_SHA256.txt"
          git rev-parse HEAD | tee "$WORK/SOURCE_COMMIT.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: nctc-r388f-r383f-bypass
          path: |
            ${{ runner.temp }}/r388f/NightCityTransitCorporation-0.3.0-devkit-r388f-r383f-bypass.zip
            ${{ runner.temp }}/r388f/PACKAGE_SHA256.txt
            ${{ runner.temp }}/r388f/SOURCE_COMMIT.txt
          compression-level: 0
