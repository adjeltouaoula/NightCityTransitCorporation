name: physical stop prototype builder

on:
  push:
    branches:
      - experiment-physical-stop-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assemble physical stop prototype devkit
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nctc-physical-stop"
          PKG="$WORK/package"
          mkdir -p \
            "$PKG/archive/pc/mod" \
            "$PKG/r6/scripts/NCTC" \
            "$PKG/r6/tweaks/NCTC" \
            "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger" \
            "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey" \
            "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_physical_stop"

          # Keep the validated development baseline intact. The physical-stop
          # experiment itself is pure CET/Lua. The tiny REDscript file at the
          # old prototype path is only a compatibility placeholder so installing
          # this build over the failed one overwrites the stale bad script.
          cp source/archive/pc/mod/NCTCTrafficRuntime.archive "$PKG/archive/pc/mod/"
          cp source/archive/pc/mod/NCTCDisplayPrototype.archive "$PKG/archive/pc/mod/"
          cp source/redscript/NCTC/*.reds "$PKG/r6/scripts/NCTC/"
          cp source/tweaks/NCTC/*.yaml "$PKG/r6/tweaks/NCTC/"
          cp source/cet/nctc_passenger/* "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_passenger/"
          cp source/cet/nctc_survey/* "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/"
          cp source/cet/nctc_physical_stop/* "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_physical_stop/"
          cp README.md THIRD_PARTY_NOTICES.md "$PKG/"

          test ! -e "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_survey/nctc_network.json"
          test -e "$PKG/bin/x64/plugins/cyber_engine_tweaks/mods/nctc_physical_stop/init.lua"
          test -e "$PKG/r6/scripts/NCTC/NCTCPhysicalStopPrototype.reds"

          (cd "$PKG" && zip -qr "$WORK/NightCityTransitCorporation-0.3.0-devkit-physical-stop-prototype-cet.zip" .)
          unzip -t "$WORK/NightCityTransitCorporation-0.3.0-devkit-physical-stop-prototype-cet.zip"
          sha256sum "$WORK/NightCityTransitCorporation-0.3.0-devkit-physical-stop-prototype-cet.zip" | tee "$WORK/PACKAGE_SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: nctc-physical-stop-prototype-cet-package
          path: |
            ${{ runner.temp }}/nctc-physical-stop/NightCityTransitCorporation-0.3.0-devkit-physical-stop-prototype-cet.zip
            ${{ runner.temp }}/nctc-physical-stop/PACKAGE_SHA256.txt
          compression-level: 0
