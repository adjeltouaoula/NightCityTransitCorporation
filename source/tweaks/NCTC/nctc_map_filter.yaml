Mappins.NCTCStopVariant:
  $type: gamedataMappinVariant_Record
  # NCTC-only variant. It is not used by Fuel/Odometer or any vanilla POI.
  enumName: CPO_PingDoorVariant

WorldMap.NCTCStopsFilter:
  $type: WorldMapFilter_Record
  # This gives NCTC its own independent switch; it is not CustomFilter.
  enumName: Courier

WorldMap.NCTCStopsFilterGroup:
  $type: MappinUIFilterGroup_Record
  filterName: UI-MappinTypes-NCTCStops
  filterType: WorldMap.NCTCStopsFilter
  mappins:
    - Mappins.NCTCStopVariant
  shouldCollectMappins: true

WorldMap.WorldMapCustomFiltersList.list:
  - !append-once WorldMap.NCTCStopsFilterGroup

WorldMap.WorldMapQuickFiltersList.list:
  - !append-once WorldMap.NCTCStopsFilterGroup

Mappins.NCTCStopMappinDefinition:
  $type: gamedataMappinDefinition_Record
  showInWorld: false
  showOnMap: true
  showOnMinimap: false
  visibilityRange: 0
  possibleVariants:
    - Mappins.NCTCStopVariant

WorldMappinUIProfile.NCTCStop:
  $base: WorldMappinUIProfile.Quest

WorldMap.ZoomLevelImportant.mappinFilterGroups:
  - !append-once WorldMap.NCTCStopsFilterGroup

WorldMap.ZoomLevelAllMappins.mappinFilterGroups:
  - !append-once WorldMap.NCTCStopsFilterGroup

WorldMap.ZoomLevelExtraMappins.mappinFilterGroups:
  - !append-once WorldMap.NCTCStopsFilterGroup

WorldMap.ZoomLevelSubDistricts.mappinFilterGroups:
  - !append-once WorldMap.NCTCStopsFilterGroup
