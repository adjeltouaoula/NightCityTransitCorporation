# Public NCTC service vehicle. It deliberately stays out of Vehicle.vehicle_list:
# it is never a garage, summon, fuel, or maintenance vehicle for V.
Vehicle.nctc_service_mahir_mt28_coach:
  $base: Vehicle.v_mahir_mt28_coach
  # NCTO's traffic-ready Mahir is required for a valid NCTC service spawn.
  # Collider experiments must therefore start from this entity, not replace it
  # wholesale with the vanilla vehicle.
  entityTemplatePath: night_city_traffic_overhaul\entities\transport\v_mahir_mt28_coach_basic_01.ent
  # Auto Drive Enhanced exposes a dedicated passenger AutoDrive context for
  # every eligible mounted vehicle. NCTC drives this record through ADE's AI
  # command directly, so the player-facing AutoDrive action must stay disabled.
  tags:
    - !append n"NCTCServiceBus"
    # Auto Drive Enhanced reads this record tag before exposing its player
    # AutoDrive action. NCTC still sends its own traffic commands directly.
    - !append n"CannotAutoDrive"
  # Seat/door behaviour is added at runtime.

NCTCRequestW01:
  $base: SellectDestination
  caption: "Request NCTC service"

DeviceAction.NCTCRequestService:
  $base: DeviceAction.OpenWorldMap
