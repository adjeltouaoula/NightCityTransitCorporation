# Public NCTC service vehicle. It deliberately stays out of Vehicle.vehicle_list:
# it is never a garage, summon, fuel, or maintenance vehicle for V.
Vehicle.nctc_service_mahir_mt28_coach:
  $base: Vehicle.v_mahir_mt28_coach
  # NCTO's Mahir entity is its traffic-ready variant.  NCTC keeps its own
  # record and passenger runtime, while this experiment verifies whether the
  # traffic entity resolves rear under-run collisions correctly.
  entityTemplatePath: nctc\vehicles\mahir_display.ent
  tags:
    - !append n"NCTCServiceBus"
    # Compatibility guard when ADE happens to be installed. NCTC does not
    # import or invoke ADE in this experiment.
    - !append n"CannotAutoDrive"
  # Keep the vanilla Mahir entity exactly as in the validated NCBN 0.0.13
  # passenger build. Seat/door behaviour is added at runtime.

NCTCRequestW01:
  $base: SellectDestination
  caption: "Request NCTC service"

DeviceAction.NCTCRequestService:
  $base: DeviceAction.OpenWorldMap
